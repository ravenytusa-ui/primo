<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primo Max</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-amber-50/30 text-amber-950 font-sans antialiased">

    <!-- App Container -->
    <div id="app" class="max-w-md mx-auto min-h-screen relative pb-24">
        <!-- Main Content Area Rendered via JavaScript -->
        <div id="main-content"></div>

        <!-- Bottom Navigation Bar -->
        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 backdrop-blur-md border-t border-amber-100 px-6 py-3 flex justify-between items-center shadow-lg z-50">
            <button onclick="switchTab('home')" class="nav-btn flex flex-col items-center text-amber-600 hover:text-amber-700 transition" data-tab="home">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] font-bold mt-1">Home</span>
            </button>
            <button onclick="switchTab('stats')" class="nav-btn flex flex-col items-center text-amber-600 hover:text-amber-700 transition" data-tab="stats">
                <i class="fa-solid fa-chart-pie text-lg"></i>
                <span class="text-[10px] font-bold mt-1">Stats</span>
            </button>
            <button onclick="switchTab('wallet')" class="nav-btn flex flex-col items-center text-amber-600 hover:text-amber-700 transition" data-tab="wallet">
                <i class="fa-solid fa-wallet text-lg"></i>
                <span class="text-[10px] font-bold mt-1">Wallet</span>
            </button>
            <button onclick="switchTab('profile')" class="nav-btn flex flex-col items-center text-amber-600 hover:text-amber-700 transition" data-tab="profile">
                <i class="fa-solid fa-user text-lg"></i>
                <span class="text-[10px] font-bold mt-1">Profile</span>
            </button>
            <button onclick="switchTab('exit')" class="nav-btn flex flex-col items-center text-red-500 hover:text-red-600 transition" data-tab="exit">
                <i class="fa-solid fa-power-off text-lg"></i>
                <span class="text-[10px] font-bold mt-1">Exit</span>
            </button>
        </nav>
    </div>

    <script>
        let teamMembersCache = [
            { name: "111", phone: "111", status: "Active" },
            { name: "wewe", phone: "wewe", status: "Active" },
            { name: "Raven", phone: "ravenytusa@gmail.com", status: "Active" }
        ];

        function renderHome() {
            return `
                <div class="space-y-4 px-4 pt-4">
                    <div class="bg-gradient-to-br from-amber-500 to-orange-600 p-6 rounded-3xl text-white shadow-xl shadow-orange-500/20">
                        <h2 class="text-2xl font-black mb-1">Welcome to Primo Max</h2>
                        <p class="text-xs text-amber-100 font-medium">Build your team and earn rewards easily!</p>
                    </div>
                    <div class="bg-white p-5 rounded-3xl border border-amber-100 shadow-sm space-y-3">
                        <h3 class="text-xs font-black uppercase text-amber-900"><i class="fa-solid fa-bullhorn text-amber-600 mr-2"></i> Announcement</h3>
                        <p class="text-xs text-amber-800/80 leading-relaxed">Share your referral link with your friends to grow your network and unlock exciting dollar rewards and weekly salaries!</p>
                    </div>
                </div>
            `;
        }

        function renderStats() {
            const count = teamMembersCache.length;
            let membersListHtml = teamMembersCache.length > 0 ? 
                teamMembersCache.map(m => `
                    <div class="bg-amber-50/50 p-3 rounded-2xl border border-amber-200/60 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-xl bg-amber-500 text-white flex items-center justify-center font-bold text-sm shadow-sm">
                                <i class="fa-solid fa-user"></i>
                            </div>
                            <div>
                                <p class="text-xs font-black text-amber-950">${m.name}</p>
                                <p class="text-[10px] text-amber-600 font-semibold">${m.phone}</p>
                            </div>
                        </div>
                        <span class="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-extrabold">${m.status}</span>
                    </div>
                `).join('') : 
                `<div class="text-center py-6 bg-amber-50/40 rounded-2xl border border-dashed border-amber-200"><i class="fa-solid fa-users-slash text-amber-400 text-2xl mb-1"></i><p class="text-xs text-amber-700 font-medium">No team members yet</p></div>`;

            return `
                <div class="space-y-4 px-4 pt-4">
                    <!-- Top Hero Banner -->
                    <div class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-amber-500 via-orange-500 to-amber-600 p-6 text-white shadow-xl shadow-orange-500/20">
                        <div class="flex items-center justify-between mb-4">
                            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/20 text-xs font-bold uppercase">
                                <i class="fa-solid fa-users text-amber-200"></i> My Team Network
                            </span>
                            <span class="px-3 py-1 rounded-full bg-black/20 text-xs font-extrabold text-amber-100">
                                Level 1
                            </span>
                        </div>
                        <div class="flex items-baseline gap-2">
                            <h2 class="text-4xl font-black">${count}</h2>
                            <p class="text-xs font-semibold text-amber-100/90 uppercase">Total Members Added</p>
                        </div>
                    </div>

                    <!-- Quick Stats Grid -->
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-white p-4 rounded-2xl border border-amber-100 shadow-sm text-center">
                            <p class="text-[10px] text-amber-800/70 font-extrabold uppercase">Team Size</p>
                            <p class="text-xl font-black text-amber-950 mt-0.5">${count}</p>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-amber-100 shadow-sm text-center">
                            <p class="text-[10px] text-amber-800/70 font-extrabold uppercase">Level</p>
                            <p class="text-xl font-black text-amber-950 mt-0.5">1</p>
                        </div>
                    </div>

                    <!-- Milestone Goals -->
                    <div class="space-y-3">
                        <div class="bg-white p-4 rounded-2xl border border-amber-100 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-xs font-black text-amber-950">Add 10 member for 3 dollar reward</p>
                                <p class="text-[10px] text-amber-700 font-bold mt-1">Progress: ${count}/10</p>
                            </div>
                            <span class="px-3 py-1.5 rounded-xl bg-amber-50 text-amber-700 text-[10px] font-black uppercase">Reward</span>
                        </div>

                        <div class="bg-white p-4 rounded-2xl border border-amber-100 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-xs font-black text-amber-950">Add 20 users for 7 dollar reward</p>
                                <p class="text-[10px] text-amber-700 font-bold mt-1">Progress: ${count}/20</p>
                            </div>
                            <span class="px-3 py-1.5 rounded-xl bg-amber-50 text-amber-700 text-[10px] font-black uppercase">Reward</span>
                        </div>

                        <div class="bg-white p-4 rounded-2xl border border-amber-100 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-xs font-black text-amber-950">Add 30 member for weekly salary</p>
                                <p class="text-[10px] text-amber-700 font-bold mt-1">Progress: ${count}/30</p>
                            </div>
                            <span class="px-3 py-1.5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-white text-[10px] font-black uppercase">Salary</span>
                        </div>
                    </div>

                    <!-- Team Members Directory -->
                    <div class="bg-white rounded-3xl p-5 border border-amber-100 shadow-sm space-y-2.5">
                        <h3 class="text-xs font-black uppercase text-amber-900 border-b pb-2">Team Members Directory (${count} Total)</h3>
                        <div class="space-y-2.5 max-h-52 overflow-y-auto pr-1">
                            ${membersListHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderWallet() {
            return `
                <div class="space-y-4 px-4 pt-4">
                    <div class="bg-white p-6 rounded-3xl border border-amber-100 shadow-sm text-center space-y-2">
                        <p class="text-xs font-bold text-amber-700 uppercase">Total Balance</p>
                        <h2 class="text-3xl font-black text-amber-950">$0.00</h2>
                    </div>
                    <div class="bg-white p-5 rounded-3xl border border-amber-100 shadow-sm space-y-3">
                        <h3 class="text-xs font-black uppercase text-amber-900">Wallet History</h3>
                        <p class="text-xs text-amber-700/70 text-center py-4">No transactions found</p>
                    </div>
                </div>
            `;
        }

        function renderProfile() {
            return `
                <div class="space-y-4 px-4 pt-4">
                    <div class="bg-white p-6 rounded-3xl border border-amber-100 shadow-sm flex items-center gap-4">
                        <div class="w-14 h-14 rounded-2xl bg-amber-500 text-white flex items-center justify-center text-2xl font-bold shadow-md">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <div>
                            <h3 class="text-base font-black text-amber-950">Primo User</h3>
                            <p class="text-xs text-amber-600 font-medium">Account Status: Active</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function switchTab(tab) {
            const container = document.getElementById('main-content');
            if (tab === 'home') container.innerHTML = renderHome();
            else if (tab === 'stats') container.innerHTML = renderStats();
            else if (tab === 'wallet') container.innerHTML = renderWallet();
            else if (tab === 'profile') container.innerHTML = renderProfile();
            else if (tab === 'exit') {
                if(confirm("Are you sure you want to exit?")) {
                    window.location.reload();
                }
            }
        }

        window.onload = () => {
            switchTab('stats');
        };
    </script>
</body>
</html>
