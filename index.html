<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Project</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col items-center justify-start pb-28">

    <!-- Main Container -->
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-3xl p-6 shadow-xl space-y-6 text-center my-4 mx-auto">
        
        <!-- Header / Profile Info -->
        <div class="space-y-1">
            <h1 class="text-xl font-black text-slate-900">Dashboard</h1>
            <p class="text-xs text-slate-500">Manage your daily tasks and earnings.</p>
        </div>

        <!-- Balance Card -->
        <div class="bg-gradient-to-r from-amber-500 to-orange-500 text-white p-6 rounded-2xl shadow-md space-y-2">
            <p class="text-xs font-semibold uppercase tracking-wider opacity-90">Current Balance</p>
            <h2 id="balance-display" class="text-3xl font-black">$0.00</h2>
            <div class="flex justify-between text-xs pt-2 border-t border-white/20">
                <span>Tasks Completed: <strong id="tasks-completed-display">0</strong>/3</span>
                <span>Total Earned: <strong id="total-earned-display">$0.00</strong></span>
            </div>
        </div>

        <!-- Action Button to Open Task -->
        <button onclick="openTaskModal()" class="w-full bg-slate-900 text-white font-extrabold py-3.5 rounded-2xl text-xs uppercase tracking-wider shadow-lg hover:bg-slate-800 transition">
            <i class="fa-solid fa-tasks mr-2"></i> View Available Task
        </button>

    </div>

    <!-- Floating Fixed Bottom Navigation Bar -->
    <div class="fixed bottom-4 left-0 right-0 z-40 flex justify-center px-4">
        <div class="w-full max-w-md bg-white/90 backdrop-blur-md border border-amber-100 rounded-3xl shadow-xl py-3 px-6 flex justify-between items-center">
            <button onclick="renderDashboard('home')" class="flex flex-col items-center text-amber-600 space-y-1">
                <i class="fa-solid fa-house text-base"></i>
                <span class="text-[10px] font-bold">Home</span>
            </button>
            <button onclick="renderDashboard('stats')" class="flex flex-col items-center text-slate-400 hover:text-amber-600 transition space-y-1">
                <i class="fa-solid fa-chart-pie text-base"></i>
                <span class="text-[10px] font-semibold">Stats</span>
            </button>
            <button onclick="renderDashboard('wallet')" class="flex flex-col items-center text-slate-400 hover:text-amber-600 transition space-y-1">
                <i class="fa-solid fa-wallet text-base"></i>
                <span class="text-[10px] font-semibold">Wallet</span>
            </button>
            <button onclick="renderDashboard('profile')" class="flex flex-col items-center text-slate-400 hover:text-amber-600 transition space-y-1">
                <i class="fa-solid fa-user text-base"></i>
                <span class="text-[10px] font-semibold">Profile</span>
            </button>
            <button onclick="renderDashboard('exit')" class="flex flex-col items-center text-rose-400 hover:text-rose-600 transition space-y-1">
                <i class="fa-solid fa-power-off text-base"></i>
                <span class="text-[10px] font-semibold">Exit</span>
            </button>
        </div>
    </div>

    <!-- Script Section -->
    <script>
        // Placeholder initialization for Supabase client and user context
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Mock current user object for local session tracking
        let currentUser = JSON.parse(localStorage.getItem('primomax_user')) || {
            email: 'user@example.com',
            balance: 0.00,
            total_earned: 0.00,
            tasks_completed: 0
        };

        // Render initial values to the DOM
        function updateDashboardUI() {
            document.getElementById('balance-display').innerText = `$${parseFloat(currentUser.balance).toFixed(2)}`;
            document.getElementById('tasks-completed-display').innerText = currentUser.tasks_completed;
            document.getElementById('total-earned-display').innerText = `$${parseFloat(currentUser.total_earned).toFixed(2)}`;
        }
        updateDashboardUI();

        function renderDashboard(view) {
            updateDashboardUI();
        }

        let currentGeneratedLink = "";

        function openTaskModal() {
            if (currentUser.tasks_completed >= 3) {
                alert("You have already completed all 3 tasks for today!");
                return;
            }

            currentGeneratedLink = "https://example.com/task/" + Math.random().toString(36).substring(7);
            
            const modalHtml = `
                <div id="task-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex justify-center items-center p-4">
                    <div class="bg-white border border-amber-100 rounded-3xl p-6 w-full max-w-sm space-y-4 shadow-xl text-center max-h-[90vh] overflow-y-auto">
                        <div class="w-12 h-12 bg-amber-100 text-amber-700 rounded-2xl mx-auto flex items-center justify-center text-xl">
                            <i class="fa-solid fa-list-check"></i>
                        </div>
                        <div>
                            <h3 class="text-base font-black text-slate-900">Complete Task</h3>
                            <p class="text-xs text-slate-500 mt-1">Copy the link below, paste it into the box, and click Done to earn $0.05.</p>
                        </div>

                        <!-- Random Link Box with Copy Button -->
                        <div class="flex items-center space-x-2 bg-slate-50 border border-slate-200 rounded-2xl p-2">
                            <input type="text" id="task-link-input" readonly value="${currentGeneratedLink}" class="w-full bg-transparent text-xs text-slate-700 px-2 outline-none truncate">
                            <button onclick="copyTaskLink()" class="bg-amber-500 text-white px-3 py-2 rounded-xl text-xs font-bold hover:bg-amber-600 transition whitespace-nowrap">
                                <i class="fa-solid fa-copy mr-1"></i> Copy
                            </button>
                        </div>

                        <!-- Paste Input Box -->
                        <div>
                            <input type="text" id="user-paste-input" placeholder="Paste link here..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl text-xs text-slate-700 p-3 outline-none focus:border-amber-500 transition">
                        </div>

                        <button onclick="verifyAndSubmitTask()" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 text-white font-extrabold py-3 rounded-2xl text-xs uppercase tracking-wider shadow-md hover:opacity-95 transition">
                            Done ($0.05)
                        </button>
                        
                        <button onclick="closeTaskModal()" class="w-full bg-rose-50 text-rose-600 font-extrabold py-2.5 rounded-2xl text-xs uppercase tracking-wider hover:bg-rose-100 transition">
                            Cancel
                        </button>
                    </div>
                </div>
            `;
            const div = document.createElement('div');
            div.innerHTML = modalHtml;
            document.body.appendChild(div);
        }

        function copyTaskLink() {
            const linkInput = document.getElementById('task-link-input');
            linkInput.select();
            linkInput.setSelectionRange(0, 99999); // For mobile devices
            navigator.clipboard.writeText(linkInput.value);
            alert("Link copied to clipboard!");
        }

        async function verifyAndSubmitTask() {
            const userPasteValue = document.getElementById('user-paste-input').value.trim();

            if (!userPasteValue) {
                alert("Please paste the link into the box first!");
                return;
            }

            if (userPasteValue !== currentGeneratedLink) {
                alert("The pasted link does not match the generated task link. Please copy and paste correctly.");
                return;
            }

            const newTasksCompleted = currentUser.tasks_completed + 1;
            const newBalance = parseFloat(currentUser.balance) + 0.05;
            const newTotalEarned = parseFloat(currentUser.total_earned) + 0.05;

            const { error } = await supabaseClient
                .from('users')
                .update({
                    tasks_completed: newTasksCompleted,
                    balance: newBalance,
                    total_earned: newTotalEarned
                })
                .eq('email', currentUser.email);

            if (error) {
                alert("Error updating task status: " + error.message);
                return;
            }

            currentUser.tasks_completed = newTasksCompleted;
            currentUser.balance = newBalance;
            currentUser.total_earned = newTotalEarned;
            localStorage.setItem('primomax_user', JSON.stringify(currentUser));

            closeTaskModal();
            renderDashboard('home');
            alert("Task completed successfully! $0.05 added to your balance.");
        }

        function closeTaskModal() {
            const modal = document.getElementById('task-modal');
            if (modal) {
                modal.parentElement.remove();
            }
        }
    </script>
</body>
</html>
