<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PremoMax - Earning Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-amber-50/40 min-h-screen pb-28">

    <div id="app" class="max-w-md mx-auto p-4"></div>

    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://itbcliczvrezshhkhdnj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_obr15hgVa-8mF1S7qcaSdA_XXnYUAzV';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = JSON.parse(localStorage.getItem('user')) || null;
        let currentTab = 'home';
        let authMode = 'login';
        let isWaitingForApproval = false;
        let showTasksView = false;
        let teamMembersCache = [];

        const urlParams = new URLSearchParams(window.location.search);
        const refId = urlParams.get('ref');
        if(refId && !currentUser) {
            localStorage.setItem('refId', refId);
        }

        async function render() {
            const app = document.getElementById('app');
            
            if (!currentUser) {
                app.innerHTML = renderAuth();
                return;
            }

            const { data: freshUser } = await supabaseClient.from('users').select('*').eq('id', currentUser.id).single();
            if(freshUser) {
                currentUser = freshUser;
                localStorage.setItem('user', JSON.stringify(currentUser));
            }

            if (currentUser.status === 'pending' || isWaitingForApproval) {
                app.innerHTML = renderWaitingPage();
                return;
            }

            // Pre-fetch stats if on stats tab
            if (currentTab === 'stats') {
                const { data } = await supabaseClient.from('users').select('*').eq('referred_by', currentUser.id);
                teamMembersCache = data || [];
            }

            let content = '';
            if (currentTab === 'home') content = renderHome();
            else if (currentTab === 'stats') content = renderStats();
            else if (currentTab === 'wallet') content = renderWallet();
            else if (currentTab === 'profile') content = renderProfile();

            app.innerHTML = `
                ${content}
                ${renderBottomNav()}
            `;
        }

        function renderAuth() {
            let isLoginMode = (authMode === 'login');
            return `
                <div class="bg-white p-6 rounded-3xl shadow-xl border border-amber-100 mt-8">
                    <div class="text-center mb-6">
                        <div class="inline-flex items-center justify-center w-14 h-14 bg-amber-100 text-amber-700 rounded-full text-2xl mb-2 shadow-inner">
                            <i class="fa-solid fa-crown"></i>
                        </div>
                        <h2 class="text-2xl font-extrabold text-amber-900 tracking-wide">PremoMax Portal</h2>
                        <p class="text-xs text-amber-600 font-medium">Earning & Investment Platform</p>
                    </div>

                    ${!isLoginMode ? `
                        <div class="relative mb-3.5">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-amber-500"><i class="fa-solid fa-user"></i></span>
                            <input type="text" id="name" placeholder="Full Name" class="w-full pl-11 pr-4 py-3 bg-amber-50/30 border border-amber-200/80 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
                        </div>
                    ` : ''}
                    
                    <div class="relative mb-3.5">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-amber-500"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" id="email" placeholder="Email Address" class="w-full pl-11 pr-4 py-3 bg-amber-50/30 border border-amber-200/80 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
                    </div>

                    <div class="relative mb-3.5">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-amber-500"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="password" placeholder="Password" class="w-full pl-11 pr-4 py-3 bg-amber-50/30 border border-amber-200/80 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
                    </div>

                    ${!isLoginMode ? `
                        <div class="relative mb-3.5">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-amber-500"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="retypepassword" placeholder="Retype Password" class="w-full pl-11 pr-4 py-3 bg-amber-50/30 border border-amber-200/80 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
                        </div>
                        <div class="relative mb-4">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-amber-500"><i class="fa-solid fa-phone"></i></span>
                            <input type="text" id="phone" placeholder="Phone Number" class="w-full pl-11 pr-4 py-3 bg-amber-50/30 border border-amber-200/80 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
                        </div>
                        <button onclick="handleSignup()" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-3.5 rounded-2xl font-bold shadow-lg shadow-amber-600/30 transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-user-plus"></i> Sign Up
                        </button>
                        <p onclick="switchAuthMode('login')" class="text-center text-xs text-amber-700 cursor-pointer mt-4 underline font-semibold hover:text-amber-900">Already have an account? Login</p>
                    ` : `
                        <button onclick="handleLogin()" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-3.5 rounded-2xl font-bold shadow-lg shadow-amber-600/30 transition flex items-center justify-center gap-2 mb-4">
                            <i class="fa-solid fa-right-to-bracket"></i> Login
                        </button>
                        <p onclick="switchAuthMode('signup')" class="text-center text-xs text-amber-700 cursor-pointer mt-2 underline font-semibold hover:text-amber-900">Don't have an account? Sign Up</p>
                    `}
                </div>
            `;
        }

        function switchAuthMode(mode) {
            authMode = mode;
            render();
        }

        function renderWaitingPage() {
            return `
                <div class="bg-white p-8 rounded-3xl shadow-xl border border-amber-100 mt-12 text-center">
                    <div class="flex justify-center mb-4">
                        <div class="animate-spin rounded-full h-12 w-12 border-4 border-amber-600 border-t-transparent"></div>
                    </div>
                    <h2 class="text-xl font-extrabold text-amber-900 mb-2">Payment Verification</h2>
                    <p class="text-xs text-amber-700 mb-6 bg-amber-50/60 p-3.5 rounded-2xl border border-amber-200/70">
                        <i class="fa-regular fa-clock text-amber-600 mr-1"></i> Please wait for approval. <br><b class="text-amber-900 mt-1 inline-block">Wait for approve 15 to 25 min</b>.
                    </p>
                    <button onclick="logout()" class="w-full bg-rose-50 hover:bg-rose-100 text-rose-600 p-3.5 rounded-2xl font-semibold text-xs transition flex items-center justify-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout / Exit
                    </button>
                </div>
            `;
        }

        function renderHome() {
            const lastTaskTime = localStorage.getItem(`last_task_time_${currentUser.id}`);
            let tasksCompletedToday = Number(localStorage.getItem(`tasks_count_${currentUser.id}`) || 0);
            let isResting = false;

            if (lastTaskTime) {
                const hoursPassed = (new Date().getTime() - Number(lastTaskTime)) / (1000 * 60 * 60);
                if (hoursPassed >= 24) {
                    tasksCompletedToday = 0;
                    localStorage.setItem(`tasks_count_${currentUser.id}`, 0);
                    localStorage.removeItem(`last_task_time_${currentUser.id}`);
                } else if (tasksCompletedToday >= 3) {
                    isResting = true;
                }
            }

            return `
                <div class="bg-white rounded-3xl p-5 border border-amber-100 shadow-xl mb-24">
                    <div class="flex items-center justify-between mb-4 bg-gradient-to-r from-amber-500 to-amber-600 p-4 rounded-2xl text-white shadow-lg shadow-amber-600/20">
                        <div>
                            <h2 class="text-3xl font-black">$${Number(currentUser.balance || 0).toFixed(3)}</h2>
                            <p class="text-[11px] text-amber-100 uppercase font-bold tracking-wider mt-0.5"><i class="fa-solid fa-wallet mr-1"></i>Available Balance</p>
                        </div>
                        <div class="bg-white/20 p-3 rounded-2xl backdrop-blur-sm">
                            <i class="fa-solid fa-chart-line text-xl"></i>
                        </div>
                    </div>
                    
                    <div class="mt-4">
                        ${!showTasksView ? `
                            <button onclick="toggleTasksView()" class="w-full bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-700 hover:to-amber-800 text-white p-4 rounded-2xl font-bold shadow-lg shadow-amber-600/30 transition flex items-center justify-between">
                                <span class="flex items-center gap-2 text-sm">
                                    <i class="fa-solid fa-list-check text-lg"></i> Daily Earning Tasks
                                </span>
                                <i class="fa-solid fa-chevron-right text-xs"></i>
                            </button>
                        ` : `
                            <div class="p-4 bg-amber-50/50 rounded-2xl border border-amber-100">
                                <div class="flex items-center justify-between mb-3">
                                    <h3 class="font-bold text-xs text-amber-900 flex items-center uppercase tracking-wide">
                                        <i class="fa-solid fa-list-check mr-2 text-amber-600 text-sm"></i>Daily Tasks (Earn $0.025 per task)
                                    </h3>
                                    <button onclick="toggleTasksView()" class="text-amber-700 hover:text-amber-900 text-xs font-bold bg-amber-200/50 px-2.5 py-1 rounded-xl">
                                        <i class="fa-solid fa-xmark mr-1"></i>Close
                                    </button>
                                </div>
                                ${isResting ? `
                                    <div class="bg-orange-50 border border-orange-200 text-orange-900 p-4 rounded-2xl text-center">
                                        <i class="fa-regular fa-clock text-2xl mb-1 text-orange-600"></i>
                                        <p class="font-bold text-xs">Limit Reached! (3/3 Tasks Completed)</p>
                                        <p class="text-[11px] mt-1 text-orange-700">Please rest for 24 hours. New tasks will unlock tomorrow.</p>
                                    </div>
                                ` : `
                                    <div class="space-y-2.5">
                                        ${renderTaskItem(1, 'https://google.com')}
                                        ${renderTaskItem(2, 'https://youtube.com')}
                                        ${renderTaskItem(3, 'https://wikipedia.org')}
                                    </div>
                                `}
                            </div>
                        `}
                    </div>

                    <div class="mt-4 p-4 bg-orange-50/50 rounded-2xl border border-orange-100">
                        <h3 class="font-bold text-xs text-orange-900 mb-2 flex items-center uppercase tracking-wide">
                            <i class="fa-solid fa-share-nodes mr-2 text-orange-600 text-sm"></i>Referral Link
                        </h3>
                        <div class="flex gap-2">
                            <input type="text" readonly id="ref-link" value="https://primo-gray.vercel.app/?ref=${currentUser.id}" class="w-full p-2.5 bg-white border border-orange-200 rounded-xl text-xs text-gray-600 font-mono">
                            <button onclick="copyRef()" class="bg-orange-600 hover:bg-orange-700 text-white px-3.5 py-2.5 rounded-xl text-xs font-bold transition shadow"><i class="fa-solid fa-copy"></i></button>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleTasksView() {
            showTasksView = !showTasksView;
            render();
        }

        function renderTaskItem(id, url) {
            return `
                <div class="flex items-center justify-between bg-white p-3 rounded-2xl border border-amber-100 text-xs gap-2 shadow-sm">
                    <span class="font-bold text-amber-900 flex items-center"><i class="fa-solid fa-circle-dot text-amber-500 mr-1.5 text-[8px]"></i>Task ${id}</span>
                    <button onclick="copyTaskUrl('${url}')" class="bg-amber-100 hover:bg-amber-200 text-amber-900 px-2.5 py-1.5 rounded-xl font-semibold transition"><i class="fa-solid fa-copy mr-1"></i>Copy</button>
                    <input type="text" id="task-input-${id}" placeholder="Type done" class="w-20 p-1.5 bg-amber-50/30 border border-amber-200 rounded-xl text-xs text-center focus:outline-amber-600">
                    <button onclick="completeTask(${id})" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-xl font-semibold transition shadow-sm"><i class="fa-solid fa-check mr-1"></i>Done</button>
                </div>
            `;
        }

        function copyTaskUrl(url) {
            navigator.clipboard.writeText(url);
            alert('Task link copied!');
        }

        async function completeTask(id) {
            const val = document.getElementById(`task-input-${id}`).value;
            if(!val) {
                alert('Please type done or paste link!');
                return;
            }

            let tasksCompletedToday = Number(localStorage.getItem(`tasks_count_${currentUser.id}`) || 0);
            if (tasksCompletedToday >= 3) {
                alert('You have already completed 3 tasks for today! Rest for 24 hours.');
                render();
                return;
            }

            tasksCompletedToday += 1;
            localStorage.setItem(`tasks_count_${currentUser.id}`, tasksCompletedToday);
            if (tasksCompletedToday === 1) {
                localStorage.setItem(`last_task_time_${currentUser.id}`, new Date().getTime());
            }

            currentUser.balance = Number(currentUser.balance || 0) + 0.025;
            await supabaseClient.from('users').update({ balance: currentUser.balance }).eq('id', currentUser.id);
            localStorage.setItem('user', JSON.stringify(currentUser));
            alert('Task completed! $0.025 added to balance.');
            render();
        }

        function copyRef() {
            const copyText = document.getElementById("ref-link");
            navigator.clipboard.writeText(copyText.value);
            alert("Referral link copied!");
        }

        function renderStats() {
            const count = teamMembersCache.length;
            
            let membersListHtml = teamMembersCache.length > 0 ? 
                teamMembersCache.map(m => `<p class="text-xs text-amber-800 bg-amber-50/50 p-3 rounded-xl border border-amber-100 mb-1.5 flex items-center"><i class="fa-solid fa-user-check text-amber-600 mr-2"></i><b>${m.name}</b> &nbsp;(${m.email})</p>`).join('') :
                `<p class="text-xs text-amber-700 italic text-center py-2">No members added yet.</p>`;

            return `
                <div class="bg-white rounded-3xl p-5 border border-amber-100 shadow-xl mb-24">
                    <h2 class="text-lg font-extrabold text-amber-900 mb-3 flex items-center"><i class="fa-solid fa-users text-amber-600 mr-2"></i>Team & Statistics</h2>
                    <p class="text-xs text-amber-700 mb-3.5 bg-amber-50/60 p-3.5 rounded-2xl border border-amber-100 flex items-center justify-between">
                        <span>Total Members Added:</span>
                        <span class="font-black text-amber-900 text-sm bg-white px-3 py-1 rounded-xl border border-amber-200">${count}</span>
                    </p>
                    <div class="mb-4 max-h-44 overflow-y-auto pr-1">${membersListHtml}</div>
                    
                    <div class="space-y-2">
                        <div class="p-3 bg-amber-50/50 rounded-2xl border border-amber-100 flex items-center text-xs">
                            <div class="w-8 h-8 rounded-xl bg-amber-200 text-amber-800 flex items-center justify-center mr-3"><i class="fa-solid fa-gift"></i></div>
                            <span class="font-bold text-amber-900">Add 5 members for $1.5 bonus</span>
                        </div>
                        <div class="p-3 bg-amber-50/50 rounded-2xl border border-amber-100 flex items-center text-xs">
                            <div class="w-8 h-8 rounded-xl bg-amber-200 text-amber-800 flex items-center justify-center mr-3"><i class="fa-solid fa-award"></i></div>
                            <span class="font-bold text-amber-900">Add 10 members for $5 bonus</span>
                        </div>
                        <div class="p-3 bg-amber-50/50 rounded-2xl border border-amber-100 flex items-center text-xs">
                            <div class="w-8 h-8 rounded-xl bg-amber-200 text-amber-800 flex items-center justify-center mr-3"><i class="fa-solid fa-sack-dollar"></i></div>
                            <span class="font-bold text-amber-900">Add 50 members for weekly salary</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderWallet() {
            return `
                <div class="bg-white rounded-3xl p-5 border border-amber-100 shadow-xl mb-24">
                    <h2 class="text-lg font-extrabold text-amber-900 mb-3 flex items-center"><i class="fa-solid fa-wallet text-amber-600 mr-2"></i>Withdrawal Wallet</h2>
                    <p class="text-xs text-amber-700 mb-4 bg-amber-50/60 p-3.5 rounded-2xl border border-amber-100 flex items-center justify-between">
                        <span>Balance:</span>
                        <span class="font-black text-amber-900 text-sm bg-white px-3 py-1 rounded-xl border border-amber-200">$${Number(currentUser.balance || 0).toFixed(3)}</span>
                    </p>
                    <div class="space-y-3 mb-4">
                        <select id="withdraw-method" class="w-full p-3.5 bg-amber-50/30 border border-amber-200/80 rounded-2xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                            <option>SadaPay</option>
                            <option>EasyPaisa</option>
                            <option>JazzCash</option>
                            <option>U Paisa</option>
                        </select>
                        <input type="text" id="acc-num" placeholder="Account Number" class="w-full p-3.5 bg-amber-50/30 border border-amber-200/80 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                        <input type="text" id="acc-name" placeholder="Account Holder Name" class="w-full p-3.5 bg-amber-50/30 border border-amber-200/80 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <button onclick="alert('Withdrawal request submitted successfully!')" class="w-full bg-amber-600 hover:bg-amber-700 text-white p-3.5 rounded-2xl font-bold transition shadow-lg shadow-amber-600/30 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-money-bill-transfer"></i> Withdraw
                    </button>
                </div>
            `;
        }

        function renderProfile() {
            return `
                <div class="bg-white rounded-3xl p-5 border border-amber-100 shadow-xl mb-24">
                    <h2 class="text-lg font-extrabold text-amber-900 mb-3 flex items-center"><i class="fa-solid fa-user-gear text-amber-600 mr-2"></i>Profile Settings</h2>
                    <div class="space-y-3 mb-4">
                        <input type="text" id="update-name" value="${currentUser.name}" class="w-full p-3.5 bg-amber-50/30 border border-amber-200/80 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                        <input type="text" id="update-phone" value="${currentUser.phone || ''}" placeholder="Phone Number" class="w-full p-3.5 bg-amber-50/30 border border-amber-200/80 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <button onclick="updateProfile()" class="w-full bg-amber-600 hover:bg-amber-700 text-white p-3.5 rounded-2xl font-bold mb-3 transition shadow-lg shadow-amber-600/30 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> Update Profile
                    </button>
                    <button onclick="logout()" class="w-full bg-rose-50 hover:bg-rose-100 text-rose-600 p-3.5 rounded-2xl font-bold transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i> Exit / Logout
                    </button>
                </div>
            `;
        }

        async function updateProfile() {
            const newName = document.getElementById('update-name').value;
            const newPhone = document.getElementById('update-phone').value;
            await supabaseClient.from('users').update({ name: newName, phone: newPhone }).eq('id', currentUser.id);
            currentUser.name = newName;
            currentUser.phone = newPhone;
            localStorage.setItem('user', JSON.stringify(currentUser));
            alert('Profile updated successfully!');
            render();
        }

        function renderBottomNav() {
            return `
                <div class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-md z-50 bg-white/95 backdrop-blur-md border border-amber-100 rounded-2xl p-2 shadow-2xl">
                    <div class="flex justify-around items-center">
                        <button onclick="switchTab('home')" class="flex flex-col items-center py-1 px-3 rounded-xl ${currentTab==='home'?'text-amber-600 font-bold bg-amber-50':'text-amber-700/60'} text-[11px] transition">
                            <i class="fa-solid fa-house text-sm mb-1"></i>Home
                        </button>
                        <button onclick="switchTab('stats')" class="flex flex-col items-center py-1 px-3 rounded-xl ${currentTab==='stats'?'text-amber-600 font-bold bg-amber-50':'text-amber-700/60'} text-[11px] transition">
                            <i class="fa-solid fa-chart-pie text-sm mb-1"></i>Stats
                        </button>
                        <button onclick="switchTab('wallet')" class="flex flex-col items-center py-1 px-3 rounded-xl ${currentTab==='wallet'?'text-amber-600 font-bold bg-amber-50':'text-amber-700/60'} text-[11px] transition">
                            <i class="fa-solid fa-wallet text-sm mb-1"></i>Wallet
                        </button>
                        <button onclick="switchTab('profile')" class="flex flex-col items-center py-1 px-3 rounded-xl ${currentTab==='profile'?'text-amber-600 font-bold bg-amber-50':'text-amber-700/60'} text-[11px] transition">
                            <i class="fa-solid fa-user text-sm mb-1"></i>Profile
                        </button>
                        <button onclick="logout()" class="flex flex-col items-center py-1 px-3 rounded-xl text-rose-500 text-[11px] font-semibold hover:bg-rose-50 transition">
                            <i class="fa-solid fa-power-off text-sm mb-1"></i>Exit
                        </button>
                    </div>
                </div>
            `;
        }

        function switchTab(tab) {
            currentTab = tab;
            showTasksView = false;
            render();
        }

        async function handleSignup() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const retype = document.getElementById('retypepassword').value;
            const phone = document.getElementById('phone').value;
            const referredBy = localStorage.getItem('refId') || null;
            
            if(!name || !email || !password || !phone) {
                alert('Please fill all fields');
                return;
            }
            if(password !== retype) {
                alert('Passwords do not match!');
                return;
            }

            const { data, error } = await supabaseClient.from('users').insert([{
                name, email, password, phone, status: 'pending', balance: 0.00, referred_by: referredBy ? Number(referredBy) : null
            }]).select().single();

            if(error) {
                alert('Error: ' + error.message);
            } else {
                currentUser = data;
                localStorage.setItem('user', JSON.stringify(data));
                localStorage.removeItem('refId');
                render();
            }
        }

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabaseClient.from('users').select('*').eq('email', email).eq('password', password).single();
            if(error || !data) {
                alert('Invalid email or password');
            } else {
                currentUser = data;
                localStorage.setItem('user', JSON.stringify(currentUser));
                render();
            }
        }

        function logout() {
            localStorage.removeItem('user');
            currentUser = null;
            isWaitingForApproval = false;
            showTasksView = false;
            authMode = 'login';
            render();
        }

        render();
    </script>
</body>
</html>
