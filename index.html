<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primo Max</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex justify-center items-center p-0 md:p-4">

    <!-- Mobile App Frame Wrapper -->
    <div class="w-full max-w-md bg-gradient-to-b from-slate-900 via-slate-900 to-slate-950 md:rounded-3xl md:border md:border-slate-800 shadow-2xl min-h-screen md:min-h-[850px] relative flex flex-col overflow-hidden">
        
        <!-- Header Top Bar -->
        <header class="px-6 pt-6 pb-4 flex items-center justify-between border-b border-slate-800/60 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center shadow-lg shadow-amber-500/20 text-white font-black text-lg">
                    P
                </div>
                <div>
                    <h1 class="text-base font-extrabold tracking-tight text-white">Primo Max</h1>
                    <p class="text-[11px] text-amber-400 font-medium">Enterprise Ecosystem</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button class="w-9 h-9 rounded-xl bg-slate-800/80 border border-slate-700/60 flex items-center justify-center text-slate-300 hover:text-amber-400 transition">
                    <i class="fa-solid fa-bell text-xs"></i>
                </button>
            </div>
        </header>

        <!-- Dynamic Main Scrollable Content Area -->
        <main id="main-content" class="flex-1 overflow-y-auto pb-28">
            <!-- Content injected via JS -->
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="absolute bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur-xl border-t border-slate-800 px-4 py-3 flex justify-around items-center z-50">
            <button onclick="switchTab('home')" class="nav-btn flex flex-col items-center gap-1 text-slate-400 transition" data-tab="home">
                <i class="fa-solid fa-house text-base"></i>
                <span class="text-[10px] font-bold">Home</span>
            </button>
            <button onclick="switchTab('stats')" class="nav-btn flex flex-col items-center gap-1 text-slate-400 transition" data-tab="stats">
                <i class="fa-solid fa-chart-pie text-base"></i>
                <span class="text-[10px] font-bold">Stats</span>
            </button>
            <button onclick="switchTab('wallet')" class="nav-btn flex flex-col items-center gap-1 text-slate-400 transition" data-tab="wallet">
                <i class="fa-solid fa-wallet text-base"></i>
                <span class="text-[10px] font-bold">Wallet</span>
            </button>
            <button onclick="switchTab('profile')" class="nav-btn flex flex-col items-center gap-1 text-slate-400 transition" data-tab="profile">
                <i class="fa-solid fa-user text-base"></i>
                <span class="text-[10px] font-bold">Profile</span>
            </button>
            <button onclick="switchTab('exit')" class="nav-btn flex flex-col items-center gap-1 text-rose-400 transition" data-tab="exit">
                <i class="fa-solid fa-power-off text-base"></i>
                <span class="text-[10px] font-bold">Exit</span>
            </button>
        </nav>
    </div>

    <script>
        // Data Caches
        let teamMembersCache = [
            { name: "111", phone: "111", status: "Active" },
            { name: "wewe", phone: "wewe", status: "Active" },
            { name: "Raven", phone: "ravenytusa@gmail.com", status: "Active" }
        ];

        let userProfile = {
            fullName: "Hamza Awan",
            email: "sameerawanyt4u@gmail.com",
            phone: "03263079022",
            joinedDate: "Since Jul 2026",
            avatar: null,
            balance: 25.50
        };

        let withdrawalsCache = [
            { amount: "13.67", method: "JazzCash", accNum: "03489833451", status: "PENDING" }
        ];

        function renderHome() {
            return `
                <div class="p-6 space-y-6">
                    <div class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600 p-6 text-slate-950 shadow-xl shadow-amber-500/10">
                        <div class="relative z-10 space-y-2">
                            <span class="px-3 py-1 rounded-full bg-slate-950/10 text-slate-950 font-black text-[10px] uppercase tracking-wider">Welcome Back</span>
                            <h2 class="text-2xl font-black tracking-tight">Primo Max Dashboard</h2>
                            <p class="text-xs font-semibold text-slate-900/80">Manage your network, scale your progress, and unlock elite rewards seamlessly.</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl">
                            <div class="w-8 h-8 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center text-sm font-bold mb-2">
                                <i class="fa-solid fa-bolt"></i>
                            </div>
                            <p class="text-[11px] text-slate-400 font-bold uppercase">System Status</p>
                            <p class="text-sm font-extrabold text-white mt-1">Operational</p>
                        </div>
                        <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl">
                            <div class="w-8 h-8 rounded-xl bg-orange-500/10 text-orange-400 flex items-center justify-center text-sm font-bold mb-2">
                                <i class="fa-solid fa-shield-halved"></i>
                            </div>
                            <p class="text-[11px] text-slate-400 font-bold uppercase">Security</p>
                            <p class="text-sm font-extrabold text-white mt-1">Encrypted</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStats() {
            const count = teamMembersCache.length;
            let membersListHtml = teamMembersCache.length > 0 ? 
                teamMembersCache.map(m => `
                    <div class="bg-slate-900/60 border border-slate-800/80 p-3.5 rounded-2xl flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 border border-amber-500/30 flex items-center justify-center font-bold text-sm">
                                <i class="fa-solid fa-user"></i>
                            </div>
                            <div>
                                <p class="text-xs font-black text-white">${m.name}</p>
                                <p class="text-[10px] text-slate-400 font-medium">${m.phone}</p>
                            </div>
                        </div>
                        <span class="px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-extrabold">${m.status}</span>
                    </div>
                `).join('') : 
                `<div class="text-center py-8 bg-slate-900/40 rounded-2xl border border-dashed border-slate-800"><p class="text-xs text-slate-400 font-medium">No team members added yet</p></div>`;

            return `
                <div class="p-6 space-y-6">
                    <div class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-amber-500 via-orange-500 to-amber-600 p-6 text-slate-950 shadow-xl">
                        <div class="flex items-center justify-between mb-4">
                            <span class="px-3 py-1 rounded-full bg-slate-950/15 text-[10px] font-black uppercase tracking-wider">
                                <i class="fa-solid fa-users mr-1"></i> My Team Network
                            </span>
                            <span class="px-3 py-1 rounded-full bg-slate-950/20 text-[10px] font-black uppercase">
                                Level 1
                            </span>
                        </div>
                        <div class="flex items-baseline gap-2">
                            <h2 class="text-4xl font-black tracking-tight">${count}</h2>
                            <p class="text-xs font-extrabold text-slate-900/80 uppercase">Total Members Added</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl text-center">
                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Team Size</p>
                            <p class="text-xl font-black text-amber-400 mt-1">${count}</p>
                        </div>
                        <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl text-center">
                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Tier Level</p>
                            <p class="text-xl font-black text-amber-400 mt-1">1</p>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl flex items-center justify-between">
                            <div class="space-y-1">
                                <p class="text-xs font-black text-white">Add 10 member for 3 dollar reward</p>
                                <p class="text-[10px] text-slate-400 font-semibold">Progress: ${count}/10</p>
                            </div>
                            <span class="px-3 py-1.5 rounded-xl bg-amber-500/10 text-amber-400 border border-amber-500/20 text-[10px] font-black uppercase">Reward</span>
                        </div>

                        <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl flex items-center justify-between">
                            <div class="space-y-1">
                                <p class="text-xs font-black text-white">Add 20 users for 7 dollar reward</p>
                                <p class="text-[10px] text-slate-400 font-semibold">Progress: ${count}/20</p>
                            </div>
                            <span class="px-3 py-1.5 rounded-xl bg-amber-500/10 text-amber-400 border border-amber-500/20 text-[10px] font-black uppercase">Reward</span>
                        </div>

                        <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl flex items-center justify-between">
                            <div class="space-y-1">
                                <p class="text-xs font-black text-white">Add 30 member for weekly salary</p>
                                <p class="text-[10px] text-slate-400 font-semibold">Progress: ${count}/30</p>
                            </div>
                            <span class="px-3 py-1.5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 text-[10px] font-black uppercase shadow-md">Salary</span>
                        </div>
                    </div>

                    <div class="bg-slate-900/80 border border-slate-800 p-5 rounded-3xl space-y-3">
                        <div class="flex items-center justify-between pb-2 border-b border-slate-800">
                            <h3 class="text-xs font-black uppercase tracking-wider text-slate-300">Directory</h3>
                            <span class="px-2 py-0.5 rounded-md bg-slate-800 text-amber-400 text-[10px] font-bold">${count} Total</span>
                        </div>
                        <div class="space-y-2.5 max-h-56 overflow-y-auto pr-1">
                            ${membersListHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderWallet() {
            let historyHtml = withdrawalsCache.length > 0 ?
                withdrawalsCache.map(w => `
                    <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl flex items-center justify-between">
                        <div>
                            <p class="text-xs font-black text-white">$${w.amount} <span class="text-amber-400">(${w.method})</span></p>
                            <p class="text-[10px] text-slate-400 font-medium mt-0.5">Acc: ${w.accNum}</p>
                        </div>
                        <span class="px-3 py-1 rounded-xl bg-amber-500/10 text-amber-400 border border-amber-500/20 text-[10px] font-black uppercase tracking-wider">${w.status}</span>
                    </div>
                `).join('') :
                `<p class="text-xs text-slate-500 text-center py-4">No withdrawal history</p>`;

            return `
                <div class="p-6 space-y-6">
                    <!-- Balance Display Card -->
                    <div class="bg-slate-900/80 border border-slate-800 p-6 rounded-3xl text-center space-y-1">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider">Available Balance</p>
                        <h2 class="text-3xl font-black text-white">$${userProfile.balance.toFixed(2)}</h2>
                    </div>

                    <!-- Withdrawal Form Box -->
                    <div class="bg-slate-900/60 border border-slate-800 p-5 rounded-3xl space-y-4">
                        <!-- Select Payment Method -->
                        <div class="space-y-1.5">
                            <label class="text-[10px] font-black uppercase tracking-wider text-slate-400">Payment Method</label>
                            <select id="w-method" class="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-bold text-white focus:outline-none focus:border-amber-500 transition">
                                <option value="SadaPay">SadaPay</option>
                                <option value="JazzCash">JazzCash</option>
                                <option value="EasyPaisa">EasyPaisa</option>
                                <option value="Bank Transfer">Bank Transfer</option>
                            </select>
                        </div>

                        <!-- Enter Amount -->
                        <div class="space-y-1.5">
                            <label class="text-[10px] font-black uppercase tracking-wider text-slate-400">Amount to Withdraw ($)</label>
                            <input type="number" id="w-amount" placeholder="Enter Amount to Withdraw ($)" class="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-bold text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
                        </div>

                        <!-- Account Number -->
                        <div class="space-y-1.5">
                            <label class="text-[10px] font-black uppercase tracking-wider text-slate-400">Account Number</label>
                            <input type="text" id="w-acc" placeholder="Account Number" class="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-bold text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
                        </div>

                        <!-- Account Holder Name -->
                        <div class="space-y-1.5">
                            <label class="text-[10px] font-black uppercase tracking-wider text-slate-400">Account Holder Name</label>
                            <input type="text" id="w-name" placeholder="Account Holder Name" class="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-bold text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
                        </div>

                        <!-- Withdraw Button -->
                        <button onclick="handleWithdraw()" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-black py-3.5 rounded-2xl shadow-lg shadow-orange-500/20 flex items-center justify-center gap-2 hover:opacity-95 transition active:scale-[0.98] text-xs uppercase tracking-wider">
                            <i class="fa-solid fa-money-bill-transfer"></i> Withdraw
                        </button>
                    </div>

                    <!-- Withdrawal History & Status -->
                    <div class="space-y-3">
                        <div class="flex items-center gap-2 text-xs font-black uppercase tracking-wider text-amber-400">
                            <i class="fa-solid fa-clock-rotate-left"></i> Withdrawal History & Status
                        </div>
                        <div class="space-y-2.5">
                            ${historyHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        function handleWithdraw() {
            const method = document.getElementById('w-method').value;
            const amount = parseFloat(document.getElementById('w-amount').value);
            const accNum = document.getElementById('w-acc').value;
            const accName = document.getElementById('w-name').value;

            if(!amount || !accNum || !accName) {
                alert("Please fill out all withdrawal fields!");
                return;
            }

            if(amount > userProfile.balance) {
                alert("Insufficient balance!");
                return;
            }

            // Deduct balance and add to history
            userProfile.balance -= amount;
            withdrawalsCache.unshift({
                amount: amount.toFixed(2),
                method: method,
                accNum: accNum,
                status: "PENDING"
            });

            alert("Withdrawal request submitted successfully!");
            switchTab('wallet');
        }

        function renderProfile() {
            const avatarContent = userProfile.avatar 
                ? `<img src="${userProfile.avatar}" class="w-full h-full object-cover">`
                : `<span class="text-sm font-extrabold text-amber-800">Profile</span>`;

            return `
                <div class="p-6 space-y-6">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <button onclick="switchTab('home')" class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-amber-400 transition">
                                <i class="fa-solid fa-arrow-left text-xs"></i>
                            </button>
                            <div>
                                <h2 class="text-base font-black text-white">Edit Profile</h2>
                                <p class="text-[11px] text-slate-400 font-medium">Update your info</p>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col items-center justify-center pt-2">
                        <div class="relative">
                            <div id="avatar-container" class="w-24 h-24 rounded-full bg-amber-100 border-4 border-slate-800 flex items-center justify-center text-amber-900 font-bold text-xl shadow-xl overflow-hidden">
                                ${avatarContent}
                            </div>
                            <input type="file" id="dp-file-input" accept="image/*" class="hidden" onchange="handleDpUpload(event)">
                            <div onclick="document.getElementById('dp-file-input').click()" class="absolute bottom-0 right-0 w-8 h-8 rounded-full bg-amber-500 text-slate-950 flex items-center justify-center border-2 border-slate-900 shadow-md cursor-pointer hover:bg-amber-400 transition">
                                <i class="fa-solid fa-camera text-xs"></i>
                            </div>
                            <span class="absolute top-1 right-2 w-3.5 h-3.5 rounded-full bg-emerald-500 border-2 border-slate-900"></span>
                        </div>
                        <h3 class="text-base font-black text-white mt-3">${userProfile.fullName}</h3>
                        <p class="text-[11px] text-amber-400 font-semibold mt-0.5"><i class="fa-solid fa-circle text-[6px] mr-1"></i> ${userProfile.joinedDate}</p>
                    </div>

                    <div class="space-y-4 pt-2">
                        <div class="space-y-1.5">
                            <label class="text-[10px] font-black uppercase tracking-wider text-slate-400">Full Name</label>
                            <input type="text" id="p-fullname" value="${userProfile.fullName}" class="w-full bg-slate-900/80 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-bold text-white focus:outline-none focus:border-amber-500 transition">
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-[10px] font-black uppercase tracking-wider text-slate-400">Email</label>
                            <input type="email" id="p-email" value="${userProfile.email}" class="w-full bg-slate-900/80 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-bold text-white focus:outline-none focus:border-amber-500 transition" disabled>
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-[10px] font-black uppercase tracking-wider text-slate-400">Phone</label>
                            <input type="text" id="p-phone" value="${userProfile.phone}" class="w-full bg-slate-900/80 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-bold text-white focus:outline-none focus:border-amber-500 transition">
                        </div>

                        <button onclick="saveProfileChanges()" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-black py-3.5 rounded-2xl shadow-lg shadow-orange-500/20 flex items-center justify-center gap-2 hover:opacity-95 transition active:scale-[0.98] text-xs uppercase tracking-wider">
                            <i class="fa-solid fa-floppy-disk"></i> Save
                        </button>
                    </div>
                </div>
            `;
        }

        function handleDpUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    userProfile.avatar = e.target.result;
                    const container = document.getElementById('avatar-container');
                    if (container) {
                        container.innerHTML = `<img src="${userProfile.avatar}" class="w-full h-full object-cover">`;
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function saveProfileChanges() {
            const nameInput = document.getElementById('p-fullname').value;
            const phoneInput = document.getElementById('p-phone').value;
            if(!nameInput || !phoneInput) {
                alert("Please fill out required fields!");
                return;
            }
            userProfile.fullName = nameInput;
            userProfile.phone = phoneInput;
            alert("Profile updated successfully!");
            switchTab('profile');
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if(btn.getAttribute('data-tab') === tab) {
                    btn.classList.add('text-amber-400');
                    btn.classList.remove('text-slate-400');
                } else {
                    btn.classList.remove('text-amber-400');
                    btn.classList.add('text-slate-400');
                }
            });

            const container = document.getElementById('main-content');
            if (tab === 'home') container.innerHTML = renderHome();
            else if (tab === 'stats') container.innerHTML = renderStats();
            else if (tab === 'wallet') container.innerHTML = renderWallet();
            else if (tab === 'profile') container.innerHTML = renderProfile();
            else if (tab === 'exit') {
                if(confirm("Are you sure you want to exit?")) {
                    window.location.reload();
                }
            }
        }

        window.onload = () => {
            switchTab('wallet');
        };
    </script>
</body>
</html>
