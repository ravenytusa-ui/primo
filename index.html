<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimoMax - Earning Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-amber-50/40 min-h-screen pb-28">

    <div id="app" class="max-w-md mx-auto p-4"></div>

    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://itbcliczvrezshhkhdnj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_obr15hgVa-8mF1S7qcaSdA_XXnYUAzV';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = JSON.parse(localStorage.getItem('user')) || null;
        let currentTab = 'home';
        let authMode = 'login';
        let isWaitingForApproval = false;
        let showTasksView = false;
        let teamMembersCache = [];
        let withdrawalsCache = [];

        const urlParams = new URLSearchParams(window.location.search);
        const refId = urlParams.get('ref');
        if(refId && !currentUser) {
            localStorage.setItem('refId', refId);
        }

        async function render() {
            const app = document.getElementById('app');
            
            if (!currentUser) {
                app.innerHTML = renderAuth();
                return;
            }

            const { data: freshUser } = await supabaseClient.from('users').select('*').eq('id', currentUser.id).single();
            if(freshUser) {
                currentUser = freshUser;
                localStorage.setItem('user', JSON.stringify(currentUser));
            }

            if (currentUser.status === 'pending' || isWaitingForApproval) {
                app.innerHTML = renderWaitingPage();
                return;
            }

            if (currentTab === 'stats') {
                const { data } = await supabaseClient.from('users').select('*').eq('referred_by', currentUser.id);
                teamMembersCache = data || [];
            } else if (currentTab === 'wallet') {
                const { data } = await supabaseClient.from('withdrawals').select('*').eq('user_id', currentUser.id).order('id', { ascending: false });
                withdrawalsCache = data || [];
            }

            let content = '';
            if (currentTab === 'home') content = renderHome();
            else if (currentTab === 'stats') content = renderStats();
            else if (currentTab === 'wallet') content = renderWallet();
            else if (currentTab === 'profile') content = renderProfile();

            app.innerHTML = `
                ${content}
                ${renderBottomNav()}
            `;
        }

        function renderAuth() {
            let isLoginMode = (authMode === 'login');
            return `
                <div class="bg-white p-6 rounded-3xl shadow-xl border border-amber-100 mt-8">
                    <div class="text-center mb-6">
                        <div class="inline-flex items-center justify-center w-14 h-14 bg-amber-100 text-amber-700 rounded-full text-2xl mb-2 shadow-inner">
                            <i class="fa-solid fa-crown"></i>
                        </div>
                        <h2 class="text-2xl font-extrabold text-amber-900 tracking-wide">PrimoMax Portal</h2>
                        <p class="text-xs text-amber-600 font-medium">Earning & Investment Platform</p>
                    </div>

                    ${!isLoginMode ? `
                        <div class="relative mb-3.5">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-amber-500"><i class="fa-solid fa-user"></i></span>
                            <input type="text" id="name" placeholder="Full Name" class="w-full pl-11 pr-4 py-3 bg-amber-50/30 border border-amber-200/80 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
                        </div>
                    ` : ''}
                    
                    <div class="relative mb-3.5">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-amber-500"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" id="email" placeholder="Email Address" class="w-full pl-11 pr-4 py-3 bg-amber-50/30 border border-amber-200/80 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
                    </div>

                    <div class="relative mb-3.5">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-amber-500"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="password" placeholder="Password" class="w-full pl-11 pr-4 py-3 bg-amber-50/30 border border-amber-200/80 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
                    </div>

                    ${!isLoginMode ? `
                        <div class="relative mb-3.5">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-amber-500"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="retypepassword" placeholder="Retype Password" class="w-full pl-11 pr-4 py-3 bg-amber-50/30 border border-amber-200/80 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
                        </div>
                        <div class="relative mb-4">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-amber-500"><i class="fa-solid fa-phone"></i></span>
                            <input type="text" id="phone" placeholder="Phone Number" class="w-full pl-11 pr-4 py-3 bg-amber-50/30 border border-amber-200/80 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
                        </div>
                        <button onclick="handleSignup()" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-3.5 rounded-2xl font-bold shadow-lg shadow-amber-600/30 transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-user-plus"></i> Sign Up
                        </button>
                        <p onclick="switchAuthMode('login')" class="text-center text-xs text-amber-700 cursor-pointer mt-4 underline font-semibold hover:text-amber-900">Already have an account? Login</p>
                    ` : `
                        <button onclick="handleLogin()" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-3.5 rounded-2xl font-bold shadow-lg shadow-amber-600/30 transition flex items-center justify-center gap-2 mb-4">
                            <i class="fa-solid fa-right-to-bracket"></i> Login
                        </button>
                        <p onclick="switchAuthMode('signup')" class="text-center text-xs text-amber-700 cursor-pointer mt-2 underline font-semibold hover:text-amber-900">Don't have an account? Sign Up</p>
                    `}
                </div>
            `;
        }

        function switchAuthMode(mode) {
            authMode = mode;
            render();
        }

        function renderWaitingPage() {
            if (isWaitingForApproval) {
                return `
                    <div class="bg-white p-8 rounded-3xl shadow-xl border border-amber-100 mt-12 text-center">
                        <div class="flex justify-center mb-4">
                            <div class="animate-spin rounded-full h-12 w-12 border-4 border-amber-600 border-t-transparent"></div>
                        </div>
                        <h2 class="text-xl font-extrabold text-amber-900 mb-2">Payment Verification</h2>
                        <p class="text-xs text-amber-700 mb-6 bg-amber-50/60 p-3.5 rounded-2xl border border-amber-200/70">
                            <i class="fa-regular fa-clock text-amber-600 mr-1"></i> Please wait for approval. <br><b class="text-amber-900 mt-1 inline-block">Wait for approve 15 to 25 min</b>.
                        </p>
                        <button onclick="checkApprovalStatus()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-3.5 rounded-2xl font-bold text-xs transition shadow-md flex items-center justify-center gap-2 mb-3">
                            <i class="fa-solid fa-rotate"></i> Check Approval Status
                        </button>
                        <button onclick="logout()" class="w-full bg-rose-50 hover:bg-rose-100 text-rose-600 p-3.5 rounded-2xl font-semibold text-xs transition flex items-center justify-center gap-1.5 shadow-sm">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout / Exit
                        </button>
                    </div>
                `;
            }

            return `
                <div class="bg-white p-6 rounded-3xl shadow-xl border border-amber-100 mt-6 mb-12">
                    <div class="text-center mb-4">
                        <div class="inline-flex items-center justify-center w-12 h-12 bg-amber-100 text-amber-700 rounded-full text-xl mb-2 shadow-inner">
                            <i class="fa-solid fa-wallet"></i>
                        </div>
                        <h2 class="text-xl font-extrabold text-amber-900">Deposit via SadaPay</h2>
                        <p class="text-xs text-amber-700 mt-1">Please send <b>520 PKR</b> to the account details below:</p>
                    </div>

                    <div class="bg-amber-50/60 p-4 rounded-2xl border border-amber-200/80 mb-4 text-xs space-y-1.5 text-amber-900">
                        <p><b>Account Name:</b> PrimoMax Official</p>
                        <p><b>Account Number:</b> 03123456789</p>
                        <p><b>Amount:</b> 520 PKR</p>
                    </div>

                    <div class="space-y-3 mb-4">
                        <input type="text" id="trx-id" placeholder="Transaction ID / Trx ID" class="w-full p-3.5 bg-amber-50/30 border border-amber-200/80 rounded-2xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500">
                        <input type="text" id="sender-acc" placeholder="Sender Account Number (e.g. 03XXXXXXXXX)" class="w-full p-3.5 bg-amber-50/30 border border-amber-200/80 rounded-2xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500">
                        <input type="text" id="sender-name" placeholder="Sender Account Holder Name" class="w-full p-3.5 bg-amber-50/30 border border-amber-200/80 rounded-2xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>

                    <button onclick="submitDepositProof()" class="w-full bg-amber-600 hover:bg-amber-700 text-white p-3.5 rounded-2xl font-bold text-xs transition shadow-lg shadow-amber-600/30 flex items-center justify-center gap-2 mb-3">
                        <i class="fa-solid fa-paper-plane"></i> Submit Payment Proof
                    </button>

                    <button onclick="logout()" class="w-full bg-rose-50 hover:bg-rose-100 text-rose-600 p-3 rounded-2xl font-semibold text-xs transition flex items-center justify-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout / Exit
                    </button>
                </div>
            `;
        }

        async function checkApprovalStatus() {
            const { data } = await supabaseClient.from('users').select('*').eq('id', currentUser.id).single();
            if (data && data.status === 'approved') {
                currentUser = data;
                localStorage.setItem('user', JSON.stringify(currentUser));
                isWaitingForApproval = false;
                render();
            } else {
                alert('Your payment is still pending approval. Please wait.');
            }
        }

        async function submitDepositProof() {
            const trxId = document.getElementById('trx-id').value;
            const senderAcc = document.getElementById('sender-acc').value;
            const senderName = document.getElementById('sender-name').value;

            if (!trxId || !senderAcc || !senderName) {
                alert('Please fill all 3 boxes with your transaction details!');
                return;
            }

            try {
                await supabaseClient.from('deposits').insert([{
                    user_id: currentUser.id,
                    email: currentUser.email,
                    trx_id: trxId,
                    sender_account: senderAcc,
                    sender_name: senderName,
                    amount: '520 PKR',
                    status: 'pending'
                }]);
            } catch(e) {
                console.log(e);
            }

            alert('Payment proof submitted successfully! Please wait for approval.');
            isWaitingForApproval = true;
            render();
        }

        function renderHome() {
            const lastTaskTime = localStorage.getItem(`last_task_time_${currentUser.id}`);
            let tasksCompletedToday = Number(localStorage.getItem(`tasks_count_${currentUser.id}`) || 0);
            let isResting = false;

            if (lastTaskTime) {
                const hoursPassed = (new Date().getTime() - Number(lastTaskTime)) / (1000 * 60 * 60);
                if (hoursPassed >= 24) {
                    tasksCompletedToday = 0;
                    localStorage.setItem(`tasks_count_${currentUser.id}`, 0);
                    localStorage.removeItem(`last_task_time_${currentUser.id}`);
                } else if (tasksCompletedToday >= 3) {
                    isResting = true;
                }
            }

            return `
                <div class="bg-white rounded-3xl p-5 border border-amber-100 shadow-xl mb-24">
                    <!-- Balance Card -->
                    <div class="bg-gradient-to-r from-amber-500 to-amber-600 p-5 rounded-2xl text-white shadow-lg shadow-amber-600/20 flex items-center justify-between mb-4">
                        <div>
                            <h2 class="text-3xl font-black">$${Number(currentUser.balance || 0).toFixed(3)}</h2>
                            <p class="text-[11px] text-amber-100 uppercase font-extrabold tracking-wider mt-0.5"><i class="fa-solid fa-wallet mr-1.5"></i>Available Balance</p>
                        </div>
                        <div class="bg-white/20 p-3 rounded-2xl backdrop-blur-sm">
                            <i class="fa-solid fa-chart-line text-xl"></i>
                        </div>
                    </div>
                    
                    <!-- Daily Earning Tasks Button / Dropdown -->
                    <div class="mb-4">
                        ${!showTasksView ? `
                            <button onclick="toggleTasksView()" class="w-full bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-700 hover:to-amber-800 text-white p-4 rounded-2xl font-bold shadow-md transition flex items-center justify-between">
                                <span class="flex items-center gap-2.5 text-xs uppercase tracking-wider font-extrabold">
                                    <i class="fa-solid fa-list-check text-base"></i> Daily Earning Tasks
                                </span>
                                <i class="fa-solid fa-chevron-right text-xs"></i>
                            </button>
                        ` : `
                            <div class="p-4 bg-amber-50/50 rounded-2xl border border-amber-200/80">
                                <div class="flex items-center justify-between mb-3">
                                    <h3 class="font-extrabold text-xs text-amber-900 flex items-center uppercase tracking-wide">
                                        <i class="fa-solid fa-list-check mr-2 text-amber-600 text-sm"></i>Daily Tasks (Earn $0.025)
                                    </h3>
                                    <button onclick="toggleTasksView()" class="text-amber-800 hover:text-amber-900 text-xs font-bold bg-amber-200/60 px-2.5 py-1 rounded-xl">
                                        <i class="fa-solid fa-xmark mr-1"></i>Close
                                    </button>
                                </div>
                                ${isResting ? `
                                    <div class="bg-orange-50 border border-orange-200 text-orange-900 p-4 rounded-2xl text-center">
                                        <i class="fa-regular fa-clock text-2xl mb-1 text-orange-600"></i>
                                        <p class="font-bold text-xs">Limit Reached! (3/3 Tasks Completed)</p>
                                        <p class="text-[11px] mt-1 text-orange-700">Please rest for 24 hours. New tasks will unlock tomorrow.</p>
                                    </div>
                                ` : `
                                    <div class="space-y-2.5">
                                        ${renderTaskItem(1, 'https://google.com')}
                                        ${renderTaskItem(2, 'https://youtube.com')}
                                        ${renderTaskItem(3, 'https://wikipedia.org')}
                                    </div>
                                `}
                            </div>
                        `}
                    </div>

                    <!-- Referral Link Section -->
                    <div class="p-4 bg-amber-50/40 rounded-2xl border border-amber-200/70">
                        <h3 class="font-extrabold text-xs text-amber-900 mb-2 flex items-center uppercase tracking-wider">
                            <i class="fa-solid fa-share-nodes mr-2 text-amber-600 text-sm"></i>Referral Link
                        </h3>
                        <div class="flex gap-2">
                            <input type="text" readonly id="ref-link" value="https://primo-max.vercel.app/?ref=${currentUser.id}" class="w-full p-2.5 bg-white border border-amber-200 rounded-xl text-xs text-gray-600 font-mono">
                            <button onclick="copyRef()" class="bg-amber-600 hover:bg-amber-700 text-white px-3.5 py-2.5 rounded-xl text-xs font-bold transition shadow"><i class="fa-solid fa-copy"></i></button>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleTasksView() {
            showTasksView = !showTasksView;
            render();
        }

        function renderTaskItem(id, url) {
            return `
                <div class="flex items-center justify-between bg-white p-3 rounded-2xl border border-amber-100 text-xs gap-2 shadow-sm">
                    <span class="font-bold text-amber-900 flex items-center"><i class="fa-solid fa-circle-dot text-amber-500 mr-1.5 text-[8px]"></i>Task ${id}</span>
                    <button onclick="copyTaskUrl('${url}')" class="bg-amber-100 hover:bg-amber-200 text-amber-900 px-2.5 py-1.5 rounded-xl font-semibold transition"><i class="fa-solid fa-copy mr-1"></i>Copy</button>
                    <input type="text" id="task-input-${id}" placeholder="Type done" class="w-20 p-1.5 bg-amber-50/30 border border-amber-200 rounded-xl text-xs text-center focus:outline-amber-600">
                    <button onclick="completeTask(${id})" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-xl font-semibold transition shadow-sm"><i class="fa-solid fa-check mr-1"></i>Done</button>
                </div>
            `;
        }

        function copyTaskUrl(url) {
            navigator.clipboard.writeText(url);
            alert('Task link copied!');
        }

        async function completeTask(id) {
            const val = document.getElementById(`task-input-${id}`).value;
            if(!val) {
                alert('Please type done or paste link!');
                return;
            }

            let tasksCompletedToday = Number(localStorage.getItem(`tasks_count_${currentUser.id}`) || 0);
            if (tasksCompletedToday >= 3) {
                alert('You have already completed 3 tasks for today! Rest for 24 hours.');
                render();
                return;
            }

            tasksCompletedToday += 1;
            localStorage.setItem(`tasks_count_${currentUser.id}`, tasksCompletedToday);
            if (tasksCompletedToday === 1) {
                localStorage.setItem(`last_task_time_${currentUser.id}`, new Date().getTime());
            }

            currentUser.balance = Number(currentUser.balance || 0) + 0.025;
            await supabaseClient.from('users').update({ balance: currentUser.balance }).eq('id', currentUser.id);
            localStorage.setItem('user', JSON.stringify(currentUser));
            alert('Task completed! $0.025 added to balance.');
            render();
        }

        function copyRef() {
            const copyText = document.getElementById("ref-link");
            navigator.clipboard.writeText(copyText.value);
            alert("Referral link copied!");
        }

        function renderStats() {
            const count = teamMembersCache.length;
            
            let membersListHtml = teamMembersCache.length > 0 ? 
                teamMembersCache.map(m => `<p class="text-xs text-amber-800 bg-amber-50/50 p-3 rounded-xl border border-amber-100 mb-1.5 flex items-center"><i class="fa-solid fa-user-check text-amber-600 mr-2"></i><b>${m.name}</b> &nbsp;(${m.email})</p>`).join('') :
                `<p class="text-xs text-amber-700 italic text-center py-2">No members added yet.</p>`;

            return `
                <div class="bg-white rounded-3xl p-5 border border-amber-100 shadow-xl mb-24">
                    <h2 class="text-lg font-extrabold text-amber-900 mb-3 flex items-center"><i class="fa-solid fa-users text-amber-600 mr-2"></i>Team & Statistics</h2>
                    <p class="text-xs text-amber-700 mb-3.5 bg-amber-50/60 p-3.5 rounded-2xl border border-amber-100 flex items-center justify-between">
                        <span>Total Members Added:</span>
                        <span class="font-black text-amber-900 text-sm bg-white px-3 py-1 rounded-xl border border-amber-200">${count}</span>
                    </p>
                    <div class="mb-4 max-h-44 overflow-y-auto pr-1">${membersListHtml}</div>
                    
                    <div class="space-y-2">
                        <div class="p-3 bg-amber-50/50 rounded-2xl border border-amber-100 flex items-center text-xs">
                            <div class="w-8 h-8 rounded-xl bg-amber-200 text-amber-800 flex items-center justify-center mr-3"><i class="fa-solid fa-gift"></i></div>
                            <span class="font-bold text-amber-900">Add 5 members for $1.5 bonus</span>
                        </div>
                        <div class="p-3 bg-amber-50/50 rounded-2xl border border-amber-100 flex items-center text-xs">
                            <div class="w-8 h-8 rounded-xl bg-amber-200 text-amber-800 flex items-center justify-center mr-3"><i class="fa-solid fa-award"></i></div>
                            <span class="font-bold text-amber-900">Add 10 members for $5 bonus</span>
                        </div>
                        <div class="p-3 bg-amber-50/50 rounded-2xl border border-amber-100 flex items-center text-xs">
                            <div class="w-8 h-8 rounded-xl bg-amber-200 text-amber-800 flex items-center justify-center mr-3"><i class="fa-solid fa-sack-dollar"></i></div>
                            <span class="font-bold text-amber-900">Add 50 members for weekly salary</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderWallet() {
            let historyHtml = withdrawalsCache.length > 0 ? 
                withdrawalsCache.map(w => {
                    let statusColor = w.status === 'approved' ? 'bg-emerald-100 text-emerald-800 border-emerald-200' : 'bg-amber-100 text-amber-800 border-amber-200';
                    let statusText = w.status === 'approved' ? 'Approved' : 'Pending';
                    return `
                        <div class="bg-amber-50/50 p-3 rounded-2xl border border-amber-100 mb-2 flex items-center justify-between text-xs">
                            <div>
                                <p class="font-black text-amber-900">$${Number(w.amount).toFixed(2)} (${w.method || 'SadaPay'})</p>
                                <p class="text-[10px] text-amber-700 mt-0.5">Acc: ${w.account_number}</p>
                            </div>
                            <span class="px-2.5 py-1 rounded-xl font-bold uppercase text-[10px] border ${statusColor}">${statusText}</span>
                        </div>
                    `;
                }).join('') :
                `<p class="text-xs text-amber-700 italic text-center py-3">No withdrawal requests found.</p>`;

            return `
                <div class="bg-white rounded-3xl p-5 border border-amber-100 shadow-xl mb-24">
                    <h2 class="text-lg font-extrabold text-amber-900 mb-3 flex items-center"><i class="fa-solid fa-wallet text-amber-600 mr-2"></i>Withdrawal Wallet</h2>
                    
                    <!-- Top Balance Box -->
                    <div class="mb-4 bg-gradient-to-r from-amber-500 to-amber-600 p-4 rounded-2xl text-white shadow-lg shadow-amber-600/20 flex items-center justify-between">
                        <div>
                            <h2 class="text-3xl font-black">$${Number(currentUser.balance || 0).toFixed(3)}</h2>
                            <p class="text-[11px] text-amber-100 uppercase font-bold tracking-wider mt-0.5"><i class="fa-solid fa-wallet mr-1"></i>Current Balance</p>
                        </div>
                        <div class="bg-white/20 p-3 rounded-2xl backdrop-blur-sm text-right">
                            <p class="text-[10px] text-amber-100 font-bold">Minimum Withdraw</p>
                            <p class="text-sm font-black text-white">$0.50</p>
                        </div>
                    </div>

                    <div class="space-y-3 mb-4">
                        <select id="withdraw-method" class="w-full p-3.5 bg-amber-50/30 border border-amber-200/80 rounded-2xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                            <option>SadaPay</option>
                            <option>EasyPaisa</option>
                            <option>JazzCash</option>
                            <option>U Paisa</option>
                        </select>
                        <input type="number" step="any" id="withdraw-amount" placeholder="Enter Amount to Withdraw ($)" class="w-full p-3.5 bg-amber-50/30 border border-amber-200/80 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                        <input type="text" id="acc-num" placeholder="Account Number" class="w-full p-3.5 bg-amber-50/30 border border-amber-200/80 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                        <input type="text" id="acc-name" placeholder="Account Holder Name" class="w-full p-3.5 bg-amber-50/30 border border-amber-200/80 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    
                    <button onclick="handleWithdraw()" class="w-full bg-amber-600 hover:bg-amber-700 text-white p-3.5 rounded-2xl font-bold transition shadow-lg shadow-amber-600/30 flex items-center justify-center gap-2 mb-6">
                        <i class="fa-solid fa-money-bill-transfer"></i> Withdraw
                    </button>

                    <!-- Withdrawal History Section -->
                    <div class="border-t border-amber-100 pt-4">
                        <h3 class="font-extrabold text-xs text-amber-900 mb-3 uppercase tracking-wide flex items-center">
                            <i class="fa-solid fa-clock-rotate-left mr-2 text-amber-600"></i>Withdrawal History & Status
                        </h3>
                        <div class="max-h-48 overflow-y-auto pr-1">
                            ${historyHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        async function handleWithdraw() {
            const method = document.getElementById('withdraw-method').value;
            const withdrawAmountInput = document.getElementById('withdraw-amount').value;
            const accNum = document.getElementById('acc-num').value;
            const accName = document.getElementById('acc-name').value;
            const currentBalance = Number(currentUser.balance || 0);
            const requestedAmount = Number(withdrawAmountInput);

            if (!withdrawAmountInput || !accNum || !accName) {
                alert('Please fill all withdrawal fields including amount!');
                return;
            }

            if (requestedAmount < 0.50) {
                alert('Minimum withdrawal amount is $0.50!');
                return;
            }

            if (requestedAmount > currentBalance) {
                alert('You do not have enough balance! Your current balance is $' + currentBalance.toFixed(3));
                return;
            }

            try {
                const { error: insertError } = await supabaseClient.from('withdrawals').insert([{
                    user_id: currentUser.id,
                    email: currentUser.email,
                    method: method,
                    account_number: accNum,
                    account_holder: accName,
                    amount: requestedAmount,
                    status: 'pending'
                }]);

                if (insertError) {
                    console.error(insertError);
                    alert('Error: ' + insertError.message);
                    return;
                }

                currentUser.balance = currentBalance - requestedAmount;
                const { error: updateError } = await supabaseClient.from('users').update({ balance: currentUser.balance }).eq('id', currentUser.id);

                if (updateError) {
                    console.error(updateError);
                    alert('Request submitted but failed to update balance: ' + updateError.message);
                } else {
                    localStorage.setItem('user', JSON.stringify(currentUser));
                    alert('Withdrawal request submitted successfully!');
                    render();
                }
            } catch(e) {
                console.log(e);
                alert('Error submitting withdrawal request.');
            }
        }

        function renderProfile() {
            let avatarContent = currentUser.avatar_url ? 
                `<img src="${currentUser.avatar_url}" class="w-full h-full object-cover">` : 
                `<div class="w-full h-full bg-amber-100 flex items-center justify-center text-amber-700 text-3xl font-bold"><i class="fa-solid fa-user"></i></div>`;

            return `
                <div class="max-w-md mx-auto mb-24">
                    <!-- Top Header with Back button style -->
                    <div class="flex items-center gap-3 mb-6">
                        <button onclick="switchTab('home')" class="w-10 h-10 bg-white rounded-2xl shadow-md border border-amber-100 flex items-center justify-center text-amber-900 hover:bg-amber-50 transition">
                            <i class="fa-solid fa-arrow-left"></i>
                        </button>
                        <div>
                            <h2 class="text-xl font-extrabold text-amber-900">Edit Profile</h2>
                            <p class="text-xs text-amber-600 font-medium">Update your info</p>
                        </div>
                    </div>

                    <!-- Profile Avatar Header -->
                    <div class="flex flex-col items-center mb-6">
                        <div class="relative">
                            <div class="w-24 h-24 rounded-full overflow-hidden border-4 border-white shadow-xl relative bg-amber-100">
                                ${avatarContent}
                            </div>
                            <span class="absolute top-1 right-1 w-4 h-4 bg-emerald-500 border-2 border-white rounded-full"></span>
                            <label for="avatar-input" class="absolute bottom-0 right-0 w-8 h-8 bg-amber-600 hover:bg-amber-700 text-white rounded-full flex items-center justify-center shadow-lg cursor-pointer transition">
                                <i class="fa-solid fa-camera text-xs"></i>
                            </label>
                            <input type="file" id="avatar-input" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)">
                        </div>
                        <h3 class="font-extrabold text-amber-900 text-base mt-2">${currentUser.name}</h3>
                        <p class="text-[11px] text-amber-600 font-medium mt-0.5"><span class="w-2 h-2 inline-block bg-amber-400 rounded-full mr-1"></span>Member</p>
                    </div>

                    <!-- Profile Form Card -->
                    <div class="bg-white rounded-3xl p-6 shadow-xl border border-amber-100 space-y-4">
                        <div>
                            <label class="block text-[11px] font-bold text-amber-800 uppercase tracking-wider mb-1.5">Full Name</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-amber-400"><i class="fa-solid fa-user text-xs"></i></span>
                                <input type="text" id="update-name" value="${currentUser.name}" class="w-full pl-11 pr-4 py-3 bg-amber-50/30 border border-amber-200/80 rounded-2xl text-xs font-semibold text-amber-900 focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
                            </div>
                        </div>

                        <div>
                            <label class="block text-[11px] font-bold text-amber-800 uppercase tracking-wider mb-1.5">Email</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-amber-400"><i class="fa-solid fa-envelope text-xs"></i></span>
                                <input type="email" disabled value="${currentUser.email}" class="w-full pl-11 pr-24 py-3 bg-amber-50/60 border border-amber-200/80 rounded-2xl text-xs font-semibold text-gray-500 cursor-not-allowed">
                                <span class="absolute inset-y-0 right-0 flex items-center pr-3">
                                    <span class="bg-emerald-100 text-emerald-800 text-[9px] font-extrabold px-2 py-0.5 rounded-lg border border-emerald-200 uppercase">Secured</span>
                                </span>
                            </div>
                        </div>

                        <div>
                            <label class="block text-[11px] font-bold text-amber-800 uppercase tracking-wider mb-1.5">Phone</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-amber-400"><i class="fa-solid fa-phone text-xs"></i></span>
                                <input type="text" id="update-phone" value="${currentUser.phone || ''}" placeholder="03XXXXXXXXX" class="w-full pl-11 pr-4 py-3 bg-amber-50/30 border border-amber-200/80 rounded-2xl text-xs font-semibold text-amber-900 focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
                            </div>
                        </div>

                        <!-- Security Section -->
                        <div class="pt-2">
                            <label class="block text-[11px] font-bold text-amber-800 uppercase tracking-wider mb-2 flex items-center">
                                <i class="fa-solid fa-shield text-amber-600 mr-1.5"></i>Security
                            </label>
                            <div class="p-4 bg-amber-50/40 rounded-2xl border border-amber-100 space-y-3">
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-amber-400"><i class="fa-solid fa-lock text-xs"></i></span>
                                    <input type="password" id="current-pass" placeholder="Current password" class="w-full pl-10 pr-10 py-3 bg-white border border-amber-200/80 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500">
                                    <button type="button" onclick="togglePassword('current-pass', this)" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-amber-400 hover:text-amber-700"><i class="fa-regular fa-eye text-xs"></i></button>
                                </div>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-amber-400"><i class="fa-solid fa-lock text-xs"></i></span>
                                    <input type="password" id="new-pass" placeholder="New password" class="w-full pl-10 pr-10 py-3 bg-white border border-amber-200/80 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500">
                                    <button type="button" onclick="togglePassword('new-pass', this)" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-amber-400 hover:text-amber-700"><i class="fa-regular fa-eye text-xs"></i></button>
                                </div>
                            </div>
                        </div>

                        <button onclick="updateProfile()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white p-3.5 rounded-2xl font-bold text-xs transition shadow-lg shadow-amber-600/30 flex items-center justify-center gap-2 mt-2">
                            <i class="fa-solid fa-floppy-disk"></i> Save
                        </button>
                    </div>
                </div>
            `;
        }

        function togglePassword(fieldId, btn) {
            const input = document.getElementById(fieldId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        async function handleAvatarUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Image = e.target.result;
                currentUser.avatar_url = base64Image;
                await supabaseClient.from('users').update({ avatar_url: base64Image }).eq('id', currentUser.id);
                localStorage.setItem('user', JSON.stringify(currentUser));
                alert('Profile picture updated successfully!');
                render();
            };
            reader.readAsDataURL(file);
        }

        async function updateProfile() {
            const newName = document.getElementById('update-name').value;
            const newPhone = document.getElementById('update-phone').value;
            const currentPassInput = document.getElementById('current-pass').value;
            const newPassInput = document.getElementById('new-pass').value;

            let updateData = { name: newName, phone: newPhone };

            if (newPassInput) {
                if (!currentPassInput) {
                    alert('Please enter your current password to set a new password!');
                    return;
                }
                if (currentPassInput !== currentUser.password) {
                    alert('Incorrect current password!');
                    return;
                }
                updateData.password = newPassInput;
                currentUser.password = newPassInput;
            }

            const { error } = await supabaseClient.from('users').update(updateData).eq('id', currentUser.id);
            if (error) {
                alert('Error updating profile: ' + error.message);
                return;
            }

            currentUser.name = newName;
            currentUser.phone = newPhone;
            localStorage.setItem('user', JSON.stringify(currentUser));
            alert('Profile updated successfully!');
            render();
        }

        function renderBottomNav() {
            return `
                <div class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-md z-50 bg-white/95 backdrop-blur-md border border-amber-100 rounded-2xl p-2 shadow-2xl">
                    <div class="flex justify-around items-center">
                        <button onclick="switchTab('home')" class="flex flex-col items-center py-1 px-3 rounded-xl ${currentTab==='home'?'text-amber-600 font-bold bg-amber-50':'text-amber-700/60'} text-[11px] transition">
                            <i class="fa-solid fa-house text-sm mb-1"></i>Home
                        </button>
                        <button onclick="switchTab('stats')" class="flex flex-col items-center py-1 px-3 rounded-xl ${currentTab==='stats'?'text-amber-600 font-bold bg-amber-50':'text-amber-700/60'} text-[11px] transition">
                            <i class="fa-solid fa-chart-pie text-sm mb-1"></i>Stats
                        </button>
                        <button onclick="switchTab('wallet')" class="flex flex-col items-center py-1 px-3 rounded-xl ${currentTab==='wallet'?'text-amber-600 font-bold bg-amber-50':'text-amber-700/60'} text-[11px] transition">
                            <i class="fa-solid fa-wallet text-sm mb-1"></i>Wallet
                        </button>
                        <button onclick="switchTab('profile')" class="flex flex-col items-center py-1 px-3 rounded-xl ${currentTab==='profile'?'text-amber-600 font-bold bg-amber-50':'text-amber-700/60'} text-[11px] transition">
                            <i class="fa-solid fa-user text-sm mb-1"></i>Profile
                        </button>
                        <button onclick="logout()" class="flex flex-col items-center py-1 px-3 rounded-xl text-rose-500 text-[11px] font-semibold hover:bg-rose-50 transition">
                            <i class="fa-solid fa-power-off text-sm mb-1"></i>Exit
                        </button>
                    </div>
                </div>
            `;
        }

        function switchTab(tab) {
            currentTab = tab;
            showTasksView = false;
            render();
        }

        async function handleSignup() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const retype = document.getElementById('retypepassword').value;
            const phone = document.getElementById('phone').value;
            const referredBy = localStorage.getItem('refId') || null;
            
            if(!name || !email || !password || !phone) {
                alert('Please fill all fields');
                return;
            }
            if(password !== retype) {
                alert('Passwords do not match!');
                return;
            }

            const { data, error } = await supabaseClient.from('users').insert([{
                name, email, password, phone, status: 'pending', balance: 0.00, referred_by: referredBy ? Number(referredBy) : null
            }]).select().single();

            if(error) {
                alert('Error: ' + error.message);
            } else {
                currentUser = data;
                localStorage.setItem('user', JSON.stringify(data));
                localStorage.removeItem('refId');
                isWaitingForApproval = false;
                render();
            }
        }

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabaseClient.from('users').select('*').eq('email', email).eq('password', password).single();
            if(error || !data) {
                alert('Invalid email or password');
            } else {
                currentUser = data;
                localStorage.setItem('user', JSON.stringify(currentUser));
                render();
            }
        }

        function logout() {
            localStorage.removeItem('user');
            currentUser = null;
            isWaitingForApproval = false;
            showTasksView = false;
            authMode = 'login';
            render();
        }

        render();
    </script>
</body>
</html>
