<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PremoMax - Earning Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-amber-50/30 min-h-screen pb-24">

    <div id="app" class="max-w-md mx-auto p-3"></div>

    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://itbcliczvrezshhkhdnj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_obr15hgVa-8mF1S7qcaSdA_XXnYUAzV';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = JSON.parse(localStorage.getItem('user')) || null;
        let currentTab = 'home';
        let authMode = 'login';
        let isWaitingForApproval = false;

        const urlParams = new URLSearchParams(window.location.search);
        const refId = urlParams.get('ref');
        if(refId && !currentUser) {
            localStorage.setItem('refId', refId);
        }

        async function render() {
            const app = document.getElementById('app');
            
            if (!currentUser) {
                app.innerHTML = renderAuth();
                return;
            }

            const { data: freshUser } = await supabaseClient.from('users').select('*').eq('id', currentUser.id).single();
            if(freshUser) {
                currentUser = freshUser;
                localStorage.setItem('user', JSON.stringify(currentUser));
            }

            if (currentUser.status === 'pending' || isWaitingForApproval) {
                app.innerHTML = renderWaitingPage();
                return;
            }

            let content = '';
            if (currentTab === 'home') content = renderHome();
            else if (currentTab === 'stats') content = renderStats();
            else if (currentTab === 'wallet') content = renderWallet();
            else if (currentTab === 'profile') content = renderProfile();

            app.innerHTML = `
                ${content}
                ${renderBottomNav()}
            `;
        }

        function renderAuth() {
            let isLoginMode = (authMode === 'login');
            return `
                <div class="bg-white p-6 rounded-2xl shadow-md border border-amber-200 mt-10">
                    <h2 class="text-2xl font-bold text-amber-900 mb-4 text-center">PremoMax Portal</h2>
                    ${!isLoginMode ? `<input type="text" id="name" placeholder="Full Name" class="w-full p-3 mb-3 border rounded-xl">` : ''}
                    <input type="email" id="email" placeholder="Email" class="w-full p-3 mb-3 border rounded-xl">
                    <input type="password" id="password" placeholder="Password" class="w-full p-3 mb-3 border rounded-xl">
                    ${!isLoginMode ? `
                        <input type="password" id="retypepassword" placeholder="Retype Password" class="w-full p-3 mb-3 border rounded-xl">
                        <input type="text" id="phone" placeholder="Phone Number" class="w-full p-3 mb-3 border rounded-xl">
                        <button onclick="handleSignup()" class="w-full bg-amber-600 text-white p-3 rounded-xl font-bold mb-3">Sign Up</button>
                        <p onclick="switchAuthMode('login')" class="text-center text-sm text-amber-700 cursor-pointer mt-2 underline font-semibold">Already have an account? Login</p>
                    ` : `
                        <button onclick="handleLogin()" class="w-full bg-amber-600 text-white p-3 rounded-xl font-bold mb-3">Login</button>
                        <p onclick="switchAuthMode('signup')" class="text-center text-sm text-amber-700 cursor-pointer mt-2 underline font-semibold">Don't have an account? Sign Up</p>
                    `}
                </div>
            `;
        }

        function switchAuthMode(mode) {
            authMode = mode;
            render();
        }

        function renderDepositPage() {
            return `
                <div class="bg-white p-6 rounded-2xl shadow-md border border-amber-200 mt-6">
                    <h2 class="text-xl font-bold text-amber-900 mb-2">Deposit via SadaPay</h2>
                    <p class="text-sm text-amber-700 mb-4 bg-amber-50 p-3 rounded-xl border border-amber-200">Fee: 520 Rs<br>Send payment to SadaPay Account: 0312-3456789</p>
                    <input type="text" id="tid" placeholder="Transaction ID" oninput="checkDepositForm()" class="w-full p-3 mb-3 border rounded-xl">
                    <input type="text" id="holder" placeholder="Account Holder Name" oninput="checkDepositForm()" class="w-full p-3 mb-3 border rounded-xl">
                    <input type="text" id="sender" placeholder="Sender Account Number" oninput="checkDepositForm()" class="w-full p-3 mb-3 border rounded-xl">
                    <button onclick="submitDeposit()" id="dep-btn" disabled class="w-full bg-gray-300 text-white p-3 rounded-xl font-bold cursor-not-allowed">Proceed Payment</button>
                    <button onclick="logout()" class="w-full mt-3 bg-rose-100 text-rose-600 p-2 rounded-semibold">Logout / Exit</button>
                </div>
            `;
        }

        function renderWaitingPage() {
            return `
                <div class="bg-white p-8 rounded-2xl shadow-md border border-amber-200 mt-12 text-center">
                    <div class="flex justify-center mb-4">
                        <div class="animate-spin rounded-full h-12 w-12 border-4 border-amber-600 border-t-transparent"></div>
                    </div>
                    <h2 class="text-xl font-bold text-amber-900 mb-2">Payment Verification</h2>
                    <p class="text-sm text-amber-700 mb-6 bg-amber-50 p-3 rounded-xl border border-amber-200">Please wait for approval. <b>Wait for approve 15 to 25 min</b>.</p>
                    <button onclick="logout()" class="w-full bg-rose-100 text-rose-600 p-3 rounded-xl font-semibold">Logout / Exit</button>
                </div>
            `;
        }

        function checkDepositForm() {
            const tid = document.getElementById('tid').value;
            const holder = document.getElementById('holder').value;
            const sender = document.getElementById('sender').value;
            const btn = document.getElementById('dep-btn');
            if(tid && holder && sender) {
                btn.disabled = false;
                btn.classList.remove('bg-gray-300', 'cursor-not-allowed');
                btn.classList.add('bg-amber-600');
            } else {
                btn.disabled = true;
                btn.classList.add('bg-gray-300', 'cursor-not-allowed');
                btn.classList.remove('bg-amber-600');
            }
        }

        async function submitDeposit() {
            const tid = document.getElementById('tid').value;
            const holder = document.getElementById('holder').value;
            const sender = document.getElementById('sender').value;
            
            const { error } = await supabaseClient.from('deposits').insert([{ 
                user_id: currentUser.id, 
                transaction_id: tid, 
                account_holder: holder, 
                sender_account: sender,
                amount: 520 
            }]);

            if(error) {
                alert('Error: ' + error.message);
                return;
            }

            isWaitingForApproval = true;
            render();
        }

        function renderHome() {
            return `
                <div class="bg-white rounded-2xl p-4 border border-amber-200 shadow-sm mb-20">
                    <h2 class="text-3xl font-bold text-amber-900">$${Number(currentUser.balance || 0).toFixed(3)}</h2>
                    <p class="text-xs text-amber-600 uppercase font-semibold">Available Balance</p>
                    
                    <div class="mt-4 p-3 bg-amber-50 rounded-xl border border-amber-200">
                        <h3 class="font-bold text-sm text-amber-900 mb-2">Daily Tasks (Earn $0.025 per task)</h3>
                        <div class="space-y-2">
                            ${renderTaskItem(1, 'https://google.com')}
                            ${renderTaskItem(2, 'https://youtube.com')}
                            ${renderTaskItem(3, 'https://wikipedia.org')}
                        </div>
                    </div>

                    <div class="mt-4 p-3 bg-orange-50 rounded-xl border border-orange-200">
                        <h3 class="font-bold text-sm text-orange-900 mb-1">Referral Link</h3>
                        <div class="flex gap-2">
                            <input type="text" readonly id="ref-link" value="https://primo-gray.vercel.app/?ref=${currentUser.id}" class="w-full p-2 bg-white border rounded-lg text-xs">
                            <button onclick="copyRef()" class="bg-orange-600 text-white px-3 py-2 rounded-lg text-xs font-bold">Copy</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTaskItem(id, url) {
            return `
                <div class="flex items-center justify-between bg-white p-2 rounded-lg border border-amber-100 text-xs gap-1">
                    <span class="truncate w-20">Task ${id}</span>
                    <button onclick="copyTaskUrl('${url}')" class="bg-amber-200 text-amber-900 px-2 py-1 rounded font-semibold">Copy</button>
                    <input type="text" id="task-input-${id}" placeholder="Type done" class="w-20 p-1 border rounded text-xs">
                    <button onclick="completeTask(${id})" class="bg-amber-600 text-white px-2 py-1 rounded font-semibold">Done</button>
                </div>
            `;
        }

        function copyTaskUrl(url) {
            navigator.clipboard.writeText(url);
            alert('Task link copied!');
        }

        async function completeTask(id) {
            const val = document.getElementById(`task-input-${id}`).value;
            if(!val) {
                alert('Please type done or paste link!');
                return;
            }
            currentUser.balance = Number(currentUser.balance || 0) + 0.025;
            await supabaseClient.from('users').update({ balance: currentUser.balance }).eq('id', currentUser.id);
            localStorage.setItem('user', JSON.stringify(currentUser));
            alert('Task completed! $0.025 added to balance.');
            render();
        }

        function copyRef() {
            const copyText = document.getElementById("ref-link");
            navigator.clipboard.writeText(copyText.value);
            alert("Referral link copied!");
        }

        async function renderStats() {
            const { data: teamMembers } = await supabaseClient.from('users').select('*').eq('referred_by', currentUser.id);
            const count = teamMembers ? teamMembers.length : 0;
            
            let membersListHtml = teamMembers && teamMembers.length > 0 ? 
                teamMembers.map(m => `<p class="text-xs text-amber-800 bg-white p-2 rounded border border-amber-100 mb-1">👤 ${m.name} (${m.email})</p>`).join('') :
                `<p class="text-xs text-amber-700">No members added yet.</p>`;

            return `
                <div class="bg-white rounded-2xl p-4 border border-amber-200 shadow-sm mb-20">
                    <h2 class="text-xl font-bold text-amber-900 mb-3">Team & Statistics</h2>
                    <p class="text-sm text-amber-700 mb-3">Total Members Added: <span class="font-bold">${count}</span></p>
                    <div class="mb-4">${membersListHtml}</div>
                    
                    <div class="space-y-3">
                        <div class="p-3 bg-amber-50 rounded-xl border border-amber-200">
                            <p class="text-xs font-bold text-amber-900">Add 5 members for $21.5 bonus</p>
                        </div>
                        <div class="p-3 bg-amber-50 rounded-xl border border-amber-200">
                            <p class="text-xs font-bold text-amber-900">Add 10 members for $5 bonus</p>
                        </div>
                        <div class="p-3 bg-amber-50 rounded-xl border border-amber-200">
                            <p class="text-xs font-bold text-amber-900">Add 50 members for weekly salary</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderWallet() {
            return `
                <div class="bg-white rounded-2xl p-4 border border-amber-200 shadow-sm mb-20">
                    <h2 class="text-xl font-bold text-amber-900 mb-3">Withdrawal Wallet</h2>
                    <p class="text-sm text-amber-700 mb-3">Balance: $${Number(currentUser.balance || 0).toFixed(3)}</p>
                    <select id="withdraw-method" class="w-full p-3 mb-3 border rounded-xl">
                        <option>SadaPay</option>
                        <option>EasyPaisa</option>
                        <option>JazzCash</option>
                        <option>U Paisa</option>
                    </select>
                    <input type="text" id="acc-num" placeholder="Account Number" class="w-full p-3 mb-3 border rounded-xl">
                    <input type="text" id="acc-name" placeholder="Account Holder Name" class="w-full p-3 mb-3 border rounded-xl">
                    <button onclick="alert('Withdrawal request submitted successfully!')" class="w-full bg-amber-600 text-white p-3 rounded-xl font-bold">Withdraw</button>
                </div>
            `;
        }

        function renderProfile() {
            return `
                <div class="bg-white rounded-2xl p-4 border border-amber-200 shadow-sm mb-20">
                    <h2 class="text-xl font-bold text-amber-900 mb-3">Profile Settings</h2>
                    <input type="text" id="update-name" value="${currentUser.name}" class="w-full p-3 mb-3 border rounded-xl">
                    <input type="text" id="update-phone" value="${currentUser.phone || ''}" class="w-full p-3 mb-3 border rounded-xl">
                    <button onclick="updateProfile()" class="w-full bg-amber-600 text-white p-3 rounded-xl font-bold mb-3">Update Profile</button>
                    <button onclick="logout()" class="w-full bg-rose-100 text-rose-600 p-3 rounded-xl font-bold">Exit / Logout</button>
                </div>
            `;
        }

        async function updateProfile() {
            const newName = document.getElementById('update-name').value;
            const newPhone = document.getElementById('update-phone').value;
            await supabaseClient.from('users').update({ name: newName, phone: newPhone }).eq('id', currentUser.id);
            currentUser.name = newName;
            currentUser.phone = newPhone;
            localStorage.setItem('user', JSON.stringify(currentUser));
            alert('Profile updated successfully!');
            render();
        }

        function renderBottomNav() {
            return `
                <div class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-sm z-50 bg-white border border-amber-200 rounded-2xl p-2 shadow-lg">
                    <div class="flex justify-around items-center">
                        <button onclick="switchTab('home')" class="flex flex-col items-center ${currentTab==='home'?'text-amber-600 font-bold':'text-amber-700/50'} text-xs">Home</button>
                        <button onclick="switchTab('stats')" class="flex flex-col items-center ${currentTab==='stats'?'text-amber-600 font-bold':'text-amber-700/50'} text-xs">Stats</button>
                        <button onclick="switchTab('wallet')" class="flex flex-col items-center ${currentTab==='wallet'?'text-amber-600 font-bold':'text-amber-700/50'} text-xs">Wallet</button>
                        <button onclick="switchTab('profile')" class="flex flex-col items-center ${currentTab==='profile'?'text-amber-600 font-bold':'text-amber-700/50'} text-xs">Profile</button>
                        <button onclick="logout()" class="flex flex-col items-center text-rose-500 text-xs font-semibold">Exit</button>
                    </div>
                </div>
            `;
        }

        function switchTab(tab) {
            currentTab = tab;
            render();
        }

        async function handleSignup() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const retype = document.getElementById('retypepassword').value;
            const phone = document.getElementById('phone').value;
            const referredBy = localStorage.getItem('refId') || null;
            
            if(!name || !email || !password || !phone) {
                alert('Please fill all fields');
                return;
            }
            if(password !== retype) {
                alert('Passwords do not match!');
                return;
            }

            const { data, error } = await supabaseClient.from('users').insert([{
                name, email, password, phone, status: 'pending', balance: 0.00, referred_by: referredBy ? Number(referredBy) : null
            }]).select().single();

            if(error) {
                alert('Error: ' + error.message);
            } else {
                currentUser = data;
                localStorage.setItem('user', JSON.stringify(data));
                localStorage.removeItem('refId');
                render();
            }
        }

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabaseClient.from('users').select('*').eq('email', email).eq('password', password).single();
            if(error || !data) {
                alert('Invalid email or password');
            } else {
                currentUser = data;
                localStorage.setItem('user', JSON.stringify(currentUser));
                render();
            }
        }

        function logout() {
            localStorage.removeItem('user');
            currentUser = null;
            isWaitingForApproval = false;
            authMode = 'login';
            render();
        }

        render();
    </script>
</body>
</html>
